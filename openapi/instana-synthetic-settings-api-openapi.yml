      - testId
    SyntheticCredential:
      type: object
      properties:
        applicationLabels:
          type: array
          items:
            type: string
            readOnly: true
          readOnly: true
        applications:
          type: array
          items:
            type: string
        createdAt:
          type: integer
          format: int64
          readOnly: true
        createdBy:
          type: string
          maxLength: 128
          minLength: 0
        credentialName:
          type: string
          maxLength: 128
          minLength: 1
        credentialValue:
          type: string
          writeOnly: true
        mobileAppLabels:
          type: array
          items:
            type: string
            readOnly: true
          readOnly: true
        mobileApps:
          type: array
          items:
            type: string
        modifiedAt:
          type: integer
          format: int64
          readOnly: true
        modifiedBy:
          type: string
          maxLength: 128
          minLength: 0
        rbacTags:
          type: array
          items:
