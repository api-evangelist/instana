openapi: 3.2.0
info:
  contact:
    email: support@instana.com
    name: © Instana
    url: http://instana.com
  termsOfService: https://www.instana.com/terms-of-use/
  title: Instana REST API documentation Infrastructure Metrics API
  version: 1.307.1417
  x-ibm-ahub-try: true
  x-logo:
    altText: instana logo
    backgroundColor: '#FAFBFC'
    url: header-logo.svg
  description: Searching for answers and best pratices?
servers:
- description: Instana Backend
  url: https://{unit}-{tenant}.instana.io
  variables:
    tenant:
      default: tenant
      description: Customer tenant unit
    unit:
      default: unit
      description: Customer tenant name
- description: Instana Self-Hosted Backend
  url: https://{domain}
  variables:
    domain:
      default: example.com
      description: Customer Self-Hosted domain
tags:
- name: Infrastructure Metrics
  description: This endpoint retrieves the metrics for infrastructure components.
paths:
  /api/infrastructure-monitoring/metrics:
    post:
      operationId: getInfrastructureMetrics
      parameters:
      - in: query
        name: offline
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetCombinedMetrics'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfrastructureMetricResult'
          description: OK
      security:
      - ApiKeyAuth:
        - Default
      summary: Get infrastructure metrics
      tags:
      - Infrastructure Metrics
      x-ibm-ahub-byok: true
      description: '- The **offline** parameter is used to allow deeper visibility into snapshots. Set to `false`, the query will return all snapshots that are still available on the given **to** timestamp. However, set to `true`, the query will return all snapshots that have been active within the time window, this must at least include the online result and snapshots terminated within this time.'
components:
  schemas:
    GetCombinedMetrics:
      type: object
      properties:
        metrics:
          type: array
          description: Id of the exact metric you want to retrieve, eg. "cpu.user", "clientrequests.read.mean"
          items:
            type: string
            description: Id of the exact metric you want to retrieve, eg. "cpu.user", "clientrequests.read.mean"
          maxItems: 5
          minItems: 1
          uniqueItems: true
        plugin:
          type: string
          description: Plugin name
          example: host
        query:
          type: string
          description: Dynamic Focus Query
          example: entity.selfType:java
        rollup:
          type: integer
          format: int32
          description: Rollup value in seconds
          example: 5
        snapshotIds:
          type: array
          description: Unique identifier the metrics are assigned to
          items:
            type: string
            description: Unique identifier the metrics are assigned to
          maxItems: 30
          minItems: 1
          uniqueItems: true
        timeFrame:
          $ref: '#/components/schemas/TimeFrame'
      required:
      - metrics
      - plugin
    InfrastructureMetricResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MetricItem'
    TimeFrame:
      type: object
      description: Time range for which the data should be retrieved.
      properties:
        to:
          type: integer
          format: int64
          description: 'end of timeframe expressed as the Unix epoch time in milliseconds. Eg: `ISO 8601` standard time `2024-06-27T05:05:55.615Z` can be represented as `1719464755615` in Unix epoch time in milliseconds.'
        windowSize:
          type: integer
          format: int64
          description: windowSize in milliseconds
          maximum: 2678400000
          minimum: 0
    MetricItem:
      type: object
      properties:
        from:
          type: integer
          format: int64
          description: Start of timeframe expressed as the Unix epoch time in milliseconds
        host:
          type: string
          description: Host name
        label:
          type: string
          description: Entitiy label
        metrics:
          type: object
          additionalProperties:
            type: array
            items:
              type: array
              items:
                type: number
        plugin:
          type: string
          description: Plugin name
        snapshotId:
          type: string
          description: Id of the exact metric you want to retrieve, eg. "cpu.user", "clientrequests.read.mean"
        tags:
          type: array
          description: Entitiy tags
          items:
            type: string
            description: Entitiy tags
        to:
          type: integer
          format: int64
          description: End of timeframe expressed as the Unix epoch time in milliseconds
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: authorization
      type: apiKey
      description: "## Example\n\n```bash\ncurl --request GET \\\n  --url https://test-instana.instana.io/api/application-monitoring/catalog/metrics \\\n  --header 'authorization: apiToken xxxxxxxxxxxxxxxx'\n```\n"
