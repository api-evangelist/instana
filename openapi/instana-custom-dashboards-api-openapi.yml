openapi: 3.2.0
info:
  contact:
    email: support@instana.com
    name: © Instana
    url: http://instana.com
  termsOfService: https://www.instana.com/terms-of-use/
  title: Instana REST API documentation Custom Dashboards API
  version: 1.307.1417
  x-ibm-ahub-try: true
  x-logo:
    altText: instana logo
    backgroundColor: '#FAFBFC'
    url: header-logo.svg
  description: Searching for answers and best pratices?
servers:
- description: Instana Backend
  url: https://{unit}-{tenant}.instana.io
  variables:
    tenant:
      default: tenant
      description: Customer tenant unit
    unit:
      default: unit
      description: Customer tenant name
- description: Instana Self-Hosted Backend
  url: https://{domain}
  variables:
    domain:
      default: example.com
      description: Customer Self-Hosted domain
tags:
- name: Custom Dashboards
  description: You can use these API endpoints to manage custom dashboards.
paths:
  /api/custom-dashboard:
    get:
      description: 'Get all accessible custom dashboards details.

        For more information on custom dashboards please access the https://developer.ibm.com/apis/catalog/instana--instana-rest-api/Settings#custom-dashboards.'
      operationId: getCustomDashboards
      parameters:
      - description: query
        example: BeeInstana
        in: query
        name: query
        schema:
          type: string
      - description: pageSize
        example: 2
        in: query
        name: pageSize
        schema:
          type: integer
          format: int32
      - description: page
        example: 1
        in: query
        name: page
        schema:
          type: integer
          format: int32
      - description: withTotalHits
        example: false
        in: query
        name: withTotalHits
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              example:
              - id: gBtvG96xRpScauwsclG-KA
                title: BeeInstana - aggregator
                annotations:
                - SHARED
              - id: UtaUyPjGSTOAmPFICSbwqw
                title: BeeInstana - alerting
                annotations:
                - SHARED
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomDashboardPreview'
          description: OK
      security:
      - ApiKeyAuth:
        - Default
      summary: Get accessible custom dashboards
      tags:
      - Custom Dashboards
      x-ibm-ahub-byok: true
    post:
      description: For more information on custom dashboards please access the https://developer.ibm.com/apis/catalog/instana--instana-rest-api/Settings#custom-dashboards.
      operationId: addCustomDashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomDashboard'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDashboard'
          description: OK
        '403':
          description: When attempting to share dashboards without the canCreatePublicCustomDashboards permission.
        '422':
          description: When the custom dashboard payload is invalid.
      security:
      - ApiKeyAuth:
        - Default
      summary: Add custom dashboard
      tags:
      - Custom Dashboards
      x-ibm-ahub-byok: true
  /api/custom-dashboard/shareable-api-tokens:
    get:
      description: 'Get all API tokens that have access to shareable custom dashboards.

        For more information on custom dashboards please access the https://developer.ibm.com/apis/catalog/instana--instana-rest-api/Settings#custom-dashboards.'
      operationId: getShareableApiTokens
      responses:
        '200':
          content:
            application/json:
              example:
              - id: foJfJVpyS5eAQAhfxSRctw
                name: New API Token
              - id: O_OKWG48S2WemaL_e3j_vQ
                name: New API Token
              - id: ATBzggrzTE-aRpUMBLmG9g
                name: New API Token
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardApiToken'
          description: OK
      security:
      - ApiKeyAuth:
        - Default
      - ApiKeyAuth:
        - CreatePublicCustomDashboards
      summary: Get all API tokens
      tags:
      - Custom Dashboards
      x-ibm-ahub-byok: true
  /api/custom-dashboard/shareable-users:
    get:
      description: 'Get all users (without invitations) that have access to shareable custom dashboards.

        For more information on custom dashboards please access the https://developer.ibm.com/apis/catalog/instana--instana-rest-api/Settings#custom-dashboards.'
      operationId: getShareableUsers
      responses:
        '200':
          content:
            application/json:
              example:
              - id: 63721be55108940001ead6fa
                email: JohnMcClane@instana.com
                fullName: John McClane
              - id: 6360a5ad034a430001c500d0
                email: HansGruber@instana.com
                fullName: Hans Gruber
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserBasicResult'
          description: OK
      security:
      - ApiKeyAuth:
        - Default
      - ApiKeyAuth:
        - CreatePublicCustomDashboards
      summary: Get all users (without invitations)
      tags:
      - Custom Dashboards
      x-ibm-ahub-byok: true
  /api/custom-dashboard/{customDashboardId}:
    delete:
      description: For more information on custom dashboards please access the https://developer.ibm.com/apis/catalog/instana--instana-rest-api/Settings#custom-dashboards.
      operationId: deleteCustomDashboard
      parameters:
      - in: path
        name: customDashboardId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Custom dashboard successfully removed
      security:
      - ApiKeyAuth:
        - Default
      summary: Remove custom dashboard
      tags:
      - Custom Dashboards
      x-ibm-ahub-byok: true
    get:
      description: 'Get all Custom Dashboard Info for specified customDashboardId.

        For more information on custom dashboards please access the https://developer.ibm.com/apis/catalog/instana--instana-rest-api/Settings#custom-dashboards.'
      operationId: getCustomDashboard
      parameters:
      - description: customDashboardId
        example: alHaYV5aSkKku_wcg53teQ
        in: path
        name: customDashboardId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example: "{\n  \"id\": \"alHaYV5aSkKku_wcg53teQ\",\n  \"title\": \"{string}\",\n  \"accessRules\": [\n    {\n      \"accessType\": \"READ_WRITE\",\n      \"relationType\": \"USER\",\n      \"relatedId\": \"5ee8a3e8cd70020001ecb007\"\n    },\n    {\n      \"accessType\": \"READ\",\n      \"relationType\": \"GLOBAL\",\n      \"relatedId\": null\n    }\n  ],\n  \"widgets\": [\n    {\n      \"id\": \"dIxxq0LCdqZomve2\",\n      \"title\": \"SUM of bytes received for a particular container\",\n      \"width\": 2,\n      \"height\": 4,\n      \"x\": 0,\n      \"y\": 0,\n      \"type\": \"bigNumber\",\n      \"config\": {\n        \"formatter\": \"bytes.detailed\",\n        \"comparisonDecreaseColor\": \"greenish\",\n        \"metricConfiguration\": {\n          \"metric\": \"network.rx.bytes\",\n          \"timeShift\": 0,\n          \"tagFilterExpression\": {\n            \"name\": \"docker.containerId\",\n            \"type\": \"TAG_FILTER\",\n            \"value\": \"faaa7f1732d16faa7fc27a0cb49fdf5c07716f3d3be1315e20f24d099657bbe0\",\n            \"entity\": \"NOT_APPLICABLE\",\n            \"operator\": \"EQUALS\"\n          },\n          \"aggregation\": \"SUM\",\n          \"source\": \"INFRASTRUCTURE_METRICS\",\n          \"crossSeriesAggregation\": \"SUM\",\n          \"type\": \"docker\"\n        },\n        \"comparisonIncreaseColor\": \"redish\"\n      }\n    }\n  ],\n  \"writable\": true,\n  \"ownerId\": {string}\n}\n"
              schema:
                $ref: '#/components/schemas/CustomDashboardWithUserSpecificInformation'
          description: OK
      security:
      - ApiKeyAuth:
        - Default
      summary: Get custom dashboard
      tags:
      - Custom Dashboards
      x-ibm-ahub-byok: true
    put:
      description: For more information on custom dashboards please access the https://developer.ibm.com/apis/catalog/instana--instana-rest-api/Settings#custom-dashboards.
      operationId: updateCustomDashboard
      parameters:
      - in: path
        name: customDashboardId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomDashboard'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDashboard'
          description: OK
        '403':
          description: When attempting to share dashboards without the canCreatePublicCustomDashboards permission.
        '422':
          description: When the custom dashboard payload is invalid.
      security:
      - ApiKeyAuth:
        - Default
      summary: Update custom dashboard
      tags:
      - Custom Dashboards
      x-ibm-ahub-byok: true
components:
  schemas:
    DashboardApiToken:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
    CustomDashboard:
      type: object
      properties:
        accessRules:
          type: array
          items:
            $ref: '#/components/schemas/AccessRule'
          maxItems: 64
          minItems: 1
        id:
          type: string
        title:
          type: string
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/Widget'
          maxItems: 128
          minItems: 0
          uniqueItems: true
      required:
      - accessRules
      - id
      - title
      - widgets
    CustomDashboardPreview:
      type: object
      properties:
        annotations:
          type: array
          items:
            type: string
            enum:
            - SHARED
            - WRITABLE
          maxItems: 8
          minItems: 0
          uniqueItems: true
        id:
          type: string
          maxLength: 64
          minLength: 0
        ownerId:
          type: string
        title:
          type: string
      required:
      - annotations
      - id
      - ownerId
      - title
    Widget:
      type: object
      properties:
        config:
          type: object
        height:
          type: integer
          format: int32
          minimum: 1
        id:
          type: string
          maxLength: 64
          minLength: 0
        title:
          type: string
        type:
          type: string
        width:
          type: integer
          format: int32
          maximum: 12
          minimum: 1
        x:
          type: integer
          format: int32
          maximum: 11
          minimum: 0
        y:
          type: integer
          format: int32
          minimum: 0
      required:
      - config
      - id
      - type
    UserBasicResult:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        id:
          type: string
      required:
      - email
      - fullName
      - id
    CustomDashboardWithUserSpecificInformation:
      type: object
      properties:
        accessRules:
          type: array
          items:
            $ref: '#/components/schemas/AccessRule'
          maxItems: 64
          minItems: 1
        id:
          type: string
        ownerId:
          type: string
        title:
          type: string
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/Widget'
          maxItems: 128
          minItems: 0
          uniqueItems: true
        writable:
          type: boolean
      required:
      - accessRules
      - id
      - ownerId
      - title
      - widgets
      - writable
    AccessRule:
      type: object
      properties:
        accessType:
          type: string
          description: "Specifies the type of access permitted. \n\n`READ`: Only viewing Application Perspective is allowed. \n\n`READ_WRITE`: Both viewing and modifying Application Perspective are permitted. \n\n"
          enum:
          - READ
          - READ_WRITE
        relatedId:
          type: string
          description: "An identifier that connects the access rule to a specific entity.\nFor example, if the `relationType` is `USER`, the corresponding `relatedId` would be a user id. \n\n**Note**: when `relationType` is `GLOBAL`, `relatedId` is `null`.\n"
          maxLength: 64
          minLength: 0
        relationType:
          type: string
          description: "Defines the type of relationship or subject to which the access rule applies. \n\n`USER`: Access is granted to an individual user. \n\n`API_TOKEN`: Access is granted to a specific API token. \n\n`ROLE`: Access is granted based on a user role, applying to any user with that role. \n\n`TEAM`: Access is granted to a team, likely applying to all team members. \n\n`GLOBAL`: Access is granted to every user or service.\n"
          enum:
          - USER
          - API_TOKEN
          - ROLE
          - TEAM
          - GLOBAL
      required:
      - accessType
      - relationType
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: authorization
      type: apiKey
      description: "## Example\n\n```bash\ncurl --request GET \\\n  --url https://test-instana.instana.io/api/application-monitoring/catalog/metrics \\\n  --header 'authorization: apiToken xxxxxxxxxxxxxxxx'\n```\n"
