tags:
- name: Groups
  description: Groups are used to permit individual users to perform specific actions and get visibility to an access scope.
paths:
  /api/settings/rbac/groups:
    get:
      operationId: getGroups
      responses:
        '200':
          content:
            application/json:
              example:
              - id: groupId1
                name: group1
                members:
                - userId: userId1
                  email: username1@example.com
                - userId: userId2
                  email: username2@example.com
              - id: groupId2
                name: group2
                members:
                - userId: userId1
                  email: username1@example.com
                - userId: userId3
                  email: username3@example.com
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiGroup'
          description: OK
        '404':
          description: No groups found
      security:
      - ApiKeyAuth:
        - CanConfigureTeams
      summary: Get groups
      tags:
      - Groups
      x-ibm-ahub-byok: true
      description: 'Retrieve the list of all groups on the tenant together with the `Permission Set` for the tenant unit.


        The `Permission Set` object contains a set of permissions applied to the group.


        In case `permissions` include the entry e.g. `LIMITED_APPLICATIONS_SCOPE`, this group will have limited access to application area.


        The areas are included inside the `permissionSet`.


        The scopeRoleId is a fixed value for each area type:


        | Area | value |

        | ----------------------- | ------------- |

        | applicationIds | -100 |

        | kubernetesClusterUUIDs | -200 |

        | kubernetesNamespaceUIDs | -300 |

        | websiteIds | -400 |

        | mobileAppIds | -500 |

        | infraDfqFilter | -600 |


        For example:


        ```

        [

        {

        "id": "7hwdhtt7TU2CJDgYXgwwww",

        "name": "Scoped Group",

        "members": [

        {

        "userId": "61892cfdfcffab03016b2950",

        "email": "jhon@example.com"

        }

        ],

        "permissionSet": {

        "permissions": [

        "CAN_VIEW_LOGS",

        "CAN_VIEW_TRACE_DETAILS",

        "CAN_EDIT_ALL_ACCESSIBLE_CUSTOM_DASHBOARDS",

        "ACCESS_APPLICATIONS",

        "LIMITED_APPLICATIONS_SCOPE",

        "ACCESS_KUBERNETES",

        "LIMITED_KUBERNETES_SCOPE",

        "ACCESS_INFRASTRUCTURE_APPS",

        "LIMITED_INFRASTRUCTURE_SCOPE",

        "LIMITED_WEBSITES_SCOPE",


        ],

        "applicationIds": [

        {

        "scopeId": "1qvWgVfLTNqi9gGTcCaNUw",

        "scopeRoleId": "-100"

        }

        ],

        "kubernetesClusterUUIDs": [

        {

        "scopeId": "induced",

        "scopeRoleId": "-200"

        }

        ],

        "kubernetesNamespaceUIDs": [],

        "websiteIds": [],

        "mobileAppIds": [],

        "infraDfqFilter": {

        "scopeId": "production",

        "scopeRoleId": "-600"

        }

        }

        ]

        ```

        In this case `Scoped Group` has no access to websites due to having `LIMITED_WEBSITES_SCOPE` but not `ACCESS_WEBSITES`.


        Also due to having `LIMITED_APPLICATIONS_SCOPE`, the only visible application is the one with this id: `1qvWgVfLTNqi9gGTcCaNUw`.


        Same applies to `kubernetesClusterUUIDs`, `kubernetesNamespaceUIDs` and `infraDfqFilter`, with the only difference is that `infraDfqFilter`

        uses a filter "production" instead of an id.'
    post:
      operationId: createGroup
      requestBody:
        content:
          application/json:
            example:
              name: group name
              members:
              - userId: userId
                email: username@example.com
              permissionSet:
                permissions:
                - CAN_VIEW_LOGS
                applicationIds:
                - scopeId: scopeId1
                  scopeRoleId: '-102'
                kubernetesClusterUUIDs: []
                kubernetesNamespaceUIDs: []
                websiteIds: []
                mobileAppIds: []
                syntheticTestIds:
                - scopeId: scopeId10
                  scopeRoleId: '-1'
                restrictedApplicationFilter:
                  label: group name
                  tagFilterExpression:
                    type: TAG_FILTER
                    name: service.name
                    stringValue: acceptor
                    numberValue: null
                    booleanValue: null
                    key: null
                    value: acceptor
                    operator: EQUALS
                    entity: DESTINATION
                  scope: INCLUDE_NO_DOWNSTREAM
                infraDfqFilter:
                  scopeId: ''
                  scopeRoleId: '-1'
                actionFilter:
                  scopeId: ''
                  scopeRoleId: '-1'
            schema:
              $ref: '#/components/schemas/ApiCreateGroup'
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                name: group name
                members:
                - userId: userId
                  email: username@example.com
                permissionSet:
                  permissions:
                  - CAN_VIEW_LOGS
                  applicationIds:
                  - scopeId: scopeId1
                    scopeRoleId: '-102'
                  kubernetesClusterUUIDs: []
                  kubernetesNamespaceUIDs: []
                  websiteIds: []
                  mobileAppIds: []
                  syntheticTestIds:
                  - scopeId: scopeId10
                    scopeRoleId: '-1'
                  restrictedApplicationFilter:
                    label: group name
                    tagFilterExpression:
                      type: TAG_FILTER
                      name: service.name
                      stringValue: acceptor
                      numberValue: null
                      booleanValue: null
                      key: null
                      value: acceptor
                      operator: EQUALS
                      entity: DESTINATION
                    scope: INCLUDE_NO_DOWNSTREAM
                  infraDfqFilter:
                    scopeId: ''
                    scopeRoleId: '-1'
                  actionFilter:
                    scopeId: ''
                    scopeRoleId: '-1'
              schema:
                $ref: '#/components/schemas/ApiGroup'
          description: OK
      security:
      - ApiKeyAuth:
        - CanConfigureTeams
      summary: Create group
      tags:
      - Groups
      x-ibm-ahub-byok: true
      description: 'Creates a group on the tenant. Each group entry also needs a `Permission Set` per unit.


        The `Permission Set` object contains a set of permissions applied to the group.


        In case `permissions` include the entry e.g. `LIMITED_APPLICATIONS_SCOPE`, this group will have limited access to application area.


        Possible access permissions values are:


        - `ACCESS_APPLICATIONS`

        - `ACCESS_INFRASTRUCTURE`

        - `ACCESS_KUBERNETES`

        - `ACCESS_MOBILE_APPS`

        - `ACCESS_WEBSITES`

        - `LIMITED_APPLICATIONS_SCOPE`

        - `LIMITED_INFRASTRUCTURE_SCOPE`

        - `LIMITED_KUBERNETES_SCOPE`

        - `LIMITED_MOBILE_APPS_SCOPE`

        - `LIMITED_WEBSITES_SCOPE`


        The `id` value for the group is ignored, a new id is generated.


        The `scopeRoleId` is ignored, the id corresponding to the area is used.


        The `scopeId` is the id for the corresponding resource.'
