          - Single
    SyntheticLocation:
      type: object
      properties:
        configuration:
          $ref: '#/components/schemas/SyntheticLocationConfiguration'
        createdAt:
          type: integer
          format: int64
        customProperties:
          type: object
          additionalProperties:
            type: string
        description:
          type: string
          maxLength: 512
          minLength: 0
        displayLabel:
          type: string
          maxLength: 128
          minLength: 1
        geoPoint:
          $ref: '#/components/schemas/SyntheticGeoPoint'
        id:
          type: string
          maxLength: 128
          minLength: 0
        label:
          type: string
          maxLength: 128
          minLength: 1
        locationType:
          type: string
        modifiedAt:
          type: integer
          format: int64
        observedAt:
          type: integer
          format: int64
        playbackCapabilities:
          $ref: '#/components/schemas/SyntheticPlaybackCapabilities'
        popVersion:
          type: string
          maxLength: 64
          minLength: 1
        status:
          type: string
        totalTests:
          type: integer
          format: int32
      required:
      - geoPoint
      - label
      - locationType
      - playbackCapabilities
    ApiTag:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 256
          minLength: 0
        id:
          type: string
          maxLength: 64
          minLength: 0
      required:
      - displayName
      - id
    SyntheticTestCICDResponse:
      type: object
      properties:
        locationId:
          type: string
        testId:
          type: string
        testResultId:
          type: string
      required:
      - locationId
      - testId
      - testResultId
    SyntheticResourceUpdateMapStringStringListString:
      type: object
      properties:
        add:
          type: object
          additionalProperties:
            type: string
        remove:
          type: array
          items:
            type: string
