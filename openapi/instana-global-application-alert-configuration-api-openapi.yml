tags:
- name: Global Application Alert Configuration
  description: The API endpoints of this group can be used to manage Global Application alert configurations.
paths:
  /api/events/settings/global-alert-configs/applications:
    get:
      description: 'Gets all Global Smart Alert Configuration. Configurations are sorted by creation date in descending order.

        For more information on Global Alert Configuration please access the https://developer.ibm.com/apis/catalog/instana--instana-rest-api/Applications#global-application-alert-configuration.'
      operationId: findActiveGlobalApplicationAlertConfigs
      parameters:
      - description: The ID of a specific global application.
        example: j02SxMRTSf-NCBXf5IdsjQ
        in: query
        name: applicationId
        required: true
        schema:
          type: string
      - description: A list of Global Smart Alert Configuration IDs. This allows fetching of a specific set of Configurations. This query can be repeated to use multiple IDs.
        example: IYS1XOEcTNiT1eOD8pxgXg
        in: query
        name: alertIds
        schema:
          type: array
          items:
            type: string
          maxItems: 1000
          minItems: 0
          uniqueItems: true
      responses:
        '200':
          content:
            application/json:
              example:
              - name: Slow calls than usual
                description: Calls are slower or equal to 2 ms based on latency (90th).
                boundaryScope: INBOUND
                applications:
                  j02SxMRTSf-NCBXf5IdsjQ:
                    applicationId: j02SxMRTSf-NCBXf5IdsjQ
                    inclusive: true
                    services: {}
                applicationIds:
                - j02SxMRTSf-NCBXf5IdsjQ
                severity: 5
                triggering: false
                tagFilterExpression:
                  type: EXPRESSION
                  logicalOperator: AND
                  elements: []
                includeInternal: false
                includeSynthetic: false
                rule:
                  alertType: slowness
                  aggregation: P90
                  metricName: latency
                threshold:
                  type: staticThreshold
                  operator: '>='
                  value: 2
                  lastUpdated: 0
                alertChannelIds: []
                granularity: 600000
                timeThreshold:
                  type: violationsInSequence
                  timeWindow: 600000
                evaluationType: PER_AP
                customPayloadFields: []
                id: vlFnxhVTS3KVb-wsN26PeQ
                created: 1707305626330
                initialCreated: 1707305626330
                readOnly: false
                enabled: true
                builtIn: false
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GlobalApplicationAlertConfigWithMetadata'
          description: OK - Returns an empty list if no configurations match the criteria
        '403':
          description: Insufficient permissions.
      security:
      - ApiKeyAuth:
        - Default
      summary: Get all Global Smart Alert Configs
      tags:
      - Global Application Alert Configuration
      x-ibm-ahub-byok: true
    post:
      description: 'Creates a new Global Smart Alert Configuration.

        For more information on Global Alert Configuration please access the https://developer.ibm.com/apis/catalog/instana--instana-rest-api/Applications#global-application-alert-configuration.'
      operationId: createGlobalApplicationAlertConfig
      requestBody:
        content:
          application/json:
            example:
              name: Slow calls than usual
              description: Calls are slower or equal to 2 ms based on latency (90th).
              boundaryScope: INBOUND
              applications:
                j02SxMRTSf-NCBXf5IdsjQ:
                  applicationId: j02SxMRTSf-NCBXf5IdsjQ
                  inclusive: true
                  services: {}
              applicationIds:
              - j02SxMRTSf-NCBXf5IdsjQ
              severity: 5
              triggering: false
              tagFilterExpression:
                type: EXPRESSION
                logicalOperator: AND
                elements: []
              includeInternal: false
              includeSynthetic: false
              rule:
                alertType: slowness
                aggregation: P90
                metricName: latency
              threshold:
                type: staticThreshold
                operator: '>='
                value: 2
                lastUpdated: 0
              alertChannelIds: []
              granularity: 600000
              timeThreshold:
                type: violationsInSequence
                timeWindow: 600000
              evaluationType: PER_AP
              customPayloadFields: []
            schema:
              $ref: '#/components/schemas/GlobalApplicationsAlertConfig'
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                name: Slow calls than usual
                description: Calls are slower or equal to 2 ms based on latency (90th).
                boundaryScope: INBOUND
                applications:
                  j02SxMRTSf-NCBXf5IdsjQ:
                    applicationId: j02SxMRTSf-NCBXf5IdsjQ
                    inclusive: true
                    services: {}
                applicationIds:
                - j02SxMRTSf-NCBXf5IdsjQ
                severity: 5
                triggering: false
                tagFilterExpression:
                  type: EXPRESSION
                  logicalOperator: AND
                  elements: []
                includeInternal: false
                includeSynthetic: false
                rule:
                  alertType: slowness
                  aggregation: P90
                  metricName: latency
                threshold:
                  type: staticThreshold
                  operator: '>='
                  value: 2
                  lastUpdated: 0
                alertChannelIds: []
                granularity: 600000
                timeThreshold:
                  type: violationsInSequence
                  timeWindow: 600000
                evaluationType: PER_AP
                customPayloadFields: []
                id: vlFnxhVTS3KVb-wsN26PeQ
                created: 1707305626330
                initialCreated: 1707305626330
                readOnly: false
                enabled: true
                builtIn: false
              schema:
                $ref: '#/components/schemas/GlobalApplicationAlertConfigWithMetadata'
          description: Global Smart Alert Configuration created.
        '400':
          description: Invalid Configuration.
        '403':
          description: Insufficient permissions.
        '422':
          description: Unprocessable entity.
      security:
      - ApiKeyAuth:
        - CanConfigureGlobalApplicationSmartAlerts
      summary: Create Global Smart Alert Config
      tags:
      - Global Application Alert Configuration
      x-ibm-ahub-byok: true
