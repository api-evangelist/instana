components:
  schemas:
    ApiPermissionSet:
      type: object
      properties:
        actionFilter:
          $ref: '#/components/schemas/ScopeBinding'
        applicationIds:
          type: array
          items:
            $ref: '#/components/schemas/ScopeBinding'
          maxItems: 1024
          minItems: 0
          uniqueItems: true
        businessPerspectiveIds:
          type: array
          items:
            $ref: '#/components/schemas/ScopeBinding'
          maxItems: 1024
          minItems: 0
          uniqueItems: true
        infraDfqFilter:
          $ref: '#/components/schemas/ScopeBinding'
        kubernetesClusterUUIDs:
          type: array
          items:
            $ref: '#/components/schemas/ScopeBinding'
          maxItems: 1024
          minItems: 0
          uniqueItems: true
        kubernetesNamespaceUIDs:
          type: array
          items:
            $ref: '#/components/schemas/ScopeBinding'
          maxItems: 1024
          minItems: 0
          uniqueItems: true
        mobileAppIds:
          type: array
          items:
            $ref: '#/components/schemas/ScopeBinding'
          maxItems: 1024
          minItems: 0
          uniqueItems: true
        permissions:
          type: array
          items:
            type: string
          maxItems: 1024
          minItems: 0
          uniqueItems: true
        restrictedApplicationFilter:
          $ref: '#/components/schemas/ApiRestrictedApplicationFilter'
        sloIds:
          type: array
          items:
            $ref: '#/components/schemas/ScopeBinding'
          maxItems: 1024
          minItems: 0
          uniqueItems: true
        syntheticCredentialKeys:
          type: array
          items:
            $ref: '#/components/schemas/ScopeBinding'
          maxItems: 1024
          minItems: 0
          uniqueItems: true
        syntheticTestIds:
          type: array
          items:
            $ref: '#/components/schemas/ScopeBinding'
          maxItems: 1024
          minItems: 0
          uniqueItems: true
        websiteIds:
          type: array
          items:
            $ref: '#/components/schemas/ScopeBinding'
          maxItems: 1024
          minItems: 0
          uniqueItems: true
      required:
      - applicationIds
      - businessPerspectiveIds
      - infraDfqFilter
      - kubernetesClusterUUIDs
      - kubernetesNamespaceUIDs
      - mobileAppIds
      - permissions
      - sloIds
      - syntheticCredentialKeys
      - syntheticTestIds
      - websiteIds
    ApiMember:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        userId:
          type: string
      required:
      - userId
    GroupMapping:
      type: object
      properties:
        groupId:
          type: string
        id:
          type: string
          maxLength: 64
          minLength: 0
        key:
          type: string
          maxLength: 65536
          minLength: 0
        teamId:
          type: string
          maxLength: 64
          minLength: 5
        value:
          type: string
          maxLength: 65536
          minLength: 0
      required:
      - groupId
      - key
      - value
    ScopeBinding:
      type: object
      properties:
        scopeId:
          type: string
          maxLength: 64
          minLength: 0
        scopeRoleId:
          type: string
          maxLength: 64
          minLength: 0
    ApiGroup:
      type: object
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 0
        members:
          type: array
          items:
            $ref: '#/components/schemas/ApiMember'
          uniqueItems: true
        name:
          type: string
        permissionSet:
          $ref: '#/components/schemas/ApiPermissionSet'
      required:
      - id
      - members
      - name
      - permissionSet
    TagFilterExpressionElement:
      type: object
      description: Boolean expression of tag filters to define the scope of relevant calls.
      discriminator:
        mapping:
          EXPRESSION: '#/components/schemas/TagFilterExpression'
          TAG_FILTER: '#/components/schemas/TagFilter'
        propertyName: type
      properties:
        type:
          type: string
      required:
      - type
    ApiRestrictedApplicationFilter:
      type: object
      properties:
        label:
          type: string
        restrictingApplicationId:
          type: string
        scope:
          type: string
          enum:
          - INCLUDE_NO_DOWNSTREAM
          - INCLUDE_IMMEDIATE_DOWNSTREAM_DATABASE_AND_MESSAGING
          - INCLUDE_ALL_DOWNSTREAM
        tagFilterExpression:
          $ref: '#/components/schemas/TagFilterExpressionElement'
    GroupMappingOverview:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        role:
          type: string
        team:
          type: string
        value:
          type: string
    IdentityProviderPatch:
      type: object
      properties:
        restrictEmptyIdpGroups:
          type: boolean
    ApiCreateGroup:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/ApiMember'
          uniqueItems: true
        name:
          type: string
        permissionSet:
          $ref: '#/components/schemas/ApiPermissionSet'
      required:
      - members
      - name
      - permissionSet
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: authorization
      type: apiKey
      description: "## Example\n\n```bash\ncurl --request GET \\\n  --url https://test-instana.instana.io/api/application-monitoring/catalog/metrics \\\n  --header 'authorization: apiToken xxxxxxxxxxxxxxxx'\n```\n"
