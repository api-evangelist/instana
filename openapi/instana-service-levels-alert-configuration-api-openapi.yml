              name: Error Budget Remaining is low
              rule:
                alertType: ERROR_BUDGET
                metric: BURNED_PERCENTAGE
              severity: 5
              sloIds:
              - SLOEANnWh9tQOa2h88kGxK6wQ
              threshold:
                type: staticThreshold
                value: 0.05
                operator: '>='
                lastUpdated: 1716454787342
              timeThreshold:
                timeWindow: 600000
              triggering: true
            schema:
              $ref: '#/components/schemas/ServiceLevelsAlertConfig'
        description: Create Request Body
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                name: Error Budget Remaining is low
                description: Error Budget Remaining is less than or equal to 5%.
                severity: 5
                triggering: true
                rule:
                  alertType: ERROR_BUDGET
                  metric: BURNED_PERCENTAGE
                threshold:
                  type: staticThreshold
                  operator: '>='
                  value: 0.05
                  lastUpdated: 1716454787342
                sloIds:
                - SLOEANnWh9tQOa2h88kGxK6wQ
                alertChannelIds: []
                timeThreshold:
                  expiry: null
                  timeWindow: 600000
                customPayloadFields:
                - type: staticString
                  key: foo
                  value: bar
                id: ln3IGogYS-S7CPqcOQYTNA
                created: 1717668384754
