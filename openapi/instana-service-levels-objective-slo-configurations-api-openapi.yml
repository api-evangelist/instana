          type: string
          description: Service Levels Objective Configuration ID
          example: SLOdCTspkHlS_OzNOATQWgsuw
      - in: query
        name: refresh
        schema:
          type: boolean
          description: Boolean operator which specifies if the cache needs to be refreshed
          example: false
      responses:
        '200':
