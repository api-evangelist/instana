- aid: instana:instana-application-resources-api
  name: Instana Application Resources API
  description: >-
    The API endpoints of this group provides insights into resources created and discovered. It includes:


    **Application Perspectives**


    Returns a list of predefined application perspectives, offering an organized view of application perspectives
    within the system.


    **Discovered Services Inside Application Perspectives**


    Fetches services identified within the context of specific application perspectives.


    **Discovered Services and Endpoints**


    Provides a detailed list of endpoints associated with services, enabling deeper visibility into service
    dependencies and interactions.


    It also provides a detailed list of services.


    These API endpoints collectively serve as a crucial tool for managing and analyzing application-level
    resource structures.
