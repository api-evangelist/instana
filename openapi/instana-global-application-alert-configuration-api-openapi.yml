          type: string
      - description: Unix timestamp representing the creation time of a specific Global Smart Alert Configuration.
        example: 1707305626330
        in: path
        name: created
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type:
              - string
              - 'null'
      responses:
        '204':
          description: Global Smart Alert Configuration restored.
        '403':
