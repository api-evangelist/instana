                  lastUpdated: 1724720573744
                forecastingConfig: null
                alertChannelIds:
                - VjS1NvcXpOARmTvA
                - CrLI3QeIZKygaNLH
                granularity: 60000
                timeThreshold:
                  type: violationsInSequence
                  timeWindow: 180000
                id: 4kxgJAXdSDiu6swQaKXrJw
                created: 1724720587414
                initialCreated: 1714766649532
                readOnly: false
                enabled: false
                customPayloadFields:
                - type: staticString
                  key: testKey
                  value: team-ar
                rules:
                - thresholdOperator: '>='
