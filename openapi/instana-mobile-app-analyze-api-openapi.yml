                    stackTrace: ''
                    stackTraceLine: []
                    parsedStackTrace: ''
                  cursor:
                    '@class': .IngestionOffsetCursor
                    ingestionTime: 1707025557248
                    offset: 1
                canLoadMore: false
                totalHits: 70
                totalRepresentedItemCount: 70
                totalRetainedItemCount: 70
                adjustedTimeframe:
                  windowSize: 60000
                  to: 1707025560000
              schema:
                $ref: '#/components/schemas/MobileAppBeaconResult'
          description: OK
      security:
      - ApiKeyAuth:
        - Default
      summary: Get all beacons
      tags:
      - Mobile App Analyze
      x-ibm-ahub-byok: true
