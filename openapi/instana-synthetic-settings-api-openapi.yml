    SyntheticLocation:
      type: object
      properties:
        configuration:
          $ref: '#/components/schemas/SyntheticLocationConfiguration'
        createdAt:
          type: integer
          format: int64
        customProperties:
          type: object
          additionalProperties:
            type: string
        description:
          type: string
          maxLength: 512
          minLength: 0
        displayLabel:
          type: string
          maxLength: 128
          minLength: 1
        geoPoint:
          $ref: '#/components/schemas/SyntheticGeoPoint'
        id:
          type: string
          maxLength: 128
          minLength: 0
        label:
          type: string
          maxLength: 128
          minLength: 1
        locationType:
          type: string
        modifiedAt:
          type: integer
          format: int64
        observedAt:
          type: integer
          format: int64
        playbackCapabilities:
          $ref: '#/components/schemas/SyntheticPlaybackCapabilities'
        popVersion:
          type: string
          maxLength: 64
          minLength: 1
        status:
          type: string
        totalTests:
          type: integer
          format: int32
      required:
      - geoPoint
      - label
      - locationType
      - playbackCapabilities
    SyntheticLocationConfiguration:
      type: object
      properties:
        clusterName:
          type: string
        namespace:
          type: string
        tenantType:
          type: string
          enum:
          - Multi
          - Single
    SyntheticTestUpdate:
      type: object
      description: Identifies the type of the synthetic tests updated on this request. Valid types are Deep and Shallow.
      discriminator:
        mapping:
          Deep: '#/components/schemas/SyntheticTestDeepUpdate'
          Shallow: '#/components/schemas/SyntheticTestShallowUpdate'
        propertyName: syntheticUpdateType
      properties:
        active:
          type: boolean
        applications:
          $ref: '#/components/schemas/SyntheticResourceUpdateListStringListString'
        customProperties:
          $ref: '#/components/schemas/SyntheticResourceUpdateMapStringStringListString'
        ids:
          type: array
          items:
            type: string
        lastModifiedAt:
          type: array
          items:
            type: integer
            format: int64
        locations:
          $ref: '#/components/schemas/SyntheticResourceUpdateListStringListString'
        mobileApps:
          $ref: '#/components/schemas/SyntheticResourceUpdateListStringListString'
        modifiedBy:
          type: string
        shallowUpdate:
          type: boolean
        syntheticUpdateType:
          type: string
          description: 'Indicates the type of update to apply to a set of tests of same syntheticType (Deep)

            or a mix of syntheticType values (Shallow). When Shallow is used, only the configuration properties

            retries, retryInterval and timeout can be updated

            '
          enum:
          - Deep
          - Shallow
        testFrequency:
          type: integer
          format: int32
          maximum: 1440
          minimum: 1
        websites:
          $ref: '#/components/schemas/SyntheticResourceUpdateListStringListString'
      required:
      - syntheticUpdateType
    SyntheticTestCICDCustomization:
      type: object
      properties:
        configuration:
          $ref: '#/components/schemas/SyntheticConfiguration'
        customProperties:
          type: object
          additionalProperties:
            type: string
        locations:
          type: array
          items:
            type: string
      required:
      - configuration
    SyntheticPlaybackCapabilities:
