  url: https://{domain}
  variables:
    domain:
      default: example.com
      description: Customer Self-Hosted domain
tags:
- name: Website Analyze
  description: The following four endpoints expose our analyze functionality.
paths:
  /api/website-monitoring/analyze/beacon-groups:
    post:
      description: 'API request to get grouped website monitoring beacon metrics.

        For more information on Website Analyze please access the https://developer.ibm.com/apis/catalog/instana--instana-rest-api/Websites+&+Mobile+Apps.'
      operationId: getBeaconGroups
      parameters:
      - in: query
        name: fillTimeSeries
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            example:
              metrics:
              - metric: beaconCount
                aggregation: SUM
                granularity: 60
              group:
                groupByTag: beacon.page.name
              tagFilterExpression:
                type: EXPRESSION
                logicalOperator: AND
                elements:
                - type: TAG_FILTER
                  name: beacon.website.name
                  operator: EQUALS
                  entity: NOT_APPLICABLE
                  value: robot-shop
                - type: TAG_FILTER
                  name: beacon.location.path
                  operator: EQUALS
                  entity: NOT_APPLICABLE
                  value: /checkout
              timeFrame:
                to: null
                windowSize: 3600000
              type: PAGELOAD
            schema:
              $ref: '#/components/schemas/GetWebsiteBeaconGroups'
      responses:
        '200':
          content:
            application/json:
              example:
                items:
                - name: Check Out
                  earliestTimestamp: 1707019058453
                  cursor:
                    '@class': .IngestionOffsetCursor
                    ingestionTime: 1707022593250
                    offset: 1
                  metrics:
                    beaconCount.sum.60:
                    - - 1707019020000
                      - 1
                    - - 1707019080000
                      - 3
                canLoadMore: false
                totalHits: 1
                totalRepresentedItemCount: 1
                totalRetainedItemCount: 1
                adjustedTimeframe:
                  windowSize: 3600000
                  to: 1707022620000
              schema:
                $ref: '#/components/schemas/WebsiteBeaconGroupsResult'
          description: OK
        '401':
          description: Unauthorized access - requires user authentication.
        '500':
          description: Internal server error.
      security:
      - ApiKeyAuth:
        - Default
      summary: Get grouped beacon metrics
      tags:
      - Website Analyze
      x-ibm-ahub-byok: true
  /api/website-monitoring/analyze/beacons:
    post:
      description: 'API request to get all website monitoring beacons with matching type.

        For more information on Website Analyze please access the https://developer.ibm.com/apis/catalog/instana--instana-rest-api/Websites+&+Mobile+Apps.'
      operationId: getBeacons
      requestBody:
        content:
          application/json:
            example:
              tagFilterExpression:
                type: TAG_FILTER
                name: beacon.website.name
                operator: EQUALS
                entity: NOT_APPLICABLE
                value: robot-shop
              timeFrame:
                to: null
                windowSize: 3600000
              type: PAGELOAD
            schema:
              $ref: '#/components/schemas/GetWebsiteBeacons'
      responses:
        '200':
          content:
            application/json:
              example:
                items:
                - beacon:
                    websiteId: Example website ID
                    websiteLabel: robot-shop
                    page: Products
                    phase: pageLoad
                    timestamp: 1707023459363
                    clockSkew: 356
                    duration: 240
                    batchSize: 1
                    accurateTimingsAvailable: true
                    deprecations: []
                    pageLoadId: 0cea1830450a460
                    sessionId: 899e5d28e5c6402
                    beaconId: 00cea1830450a460
                    backendTraceId: ef968a97dd967268
                    type: pageLoad
                    customEventName: ''
                    meta:
                      stage: production
                      status: silver
                    locationUrl: http://robotshop.instana.com/products
                    locationOrigin: http://robotshop.instana.com
                    locationPath: /products
                    errorCount: 0
                    errorMessage: ''
                    errorId: ''
                    errorType: ''
                    parsedStackTrace: []
                    componentStack: ''
                    userIp: 195.140.0.0
                    userId: Example User Id
                    userName: Example User Name
                    userEmail: example@example.com
                    userLanguages:
                    - en-GB
                    deviceType: ''
                    connectionType: 4g
                    browserName: Chrome
                    browserVersion: '73'
                    osName: Windows
                    osVersion: '10'
                    windowHidden: false
                    windowWidth: 1149
                    windowHeight: 1008
                    latitude: 51.5088
                    longitude: -0.093
                    accuracyRadius: 20
                    city: London
                    subdivision: England
                    subdivisionCode: ENG
                    country: United Kingdom
                    countryCode: GB
                    continent: Europe
                    continentCode: EU
                    httpCallUrl: ''
                    httpCallOrigin: ''
                    httpCallPath: ''
                    httpCallMethod: ''
                    httpCallStatus: -1
                    httpCallCorrelationAttempted: false
                    httpCallAsynchronous: false
                    initiator: html
                    resourceType: document
                    cacheInteraction: ''
                    encodedBodySize: -1
                    decodedBodySize: -1
                    transferSize: -1
                    unloadTime: 0
                    redirectTime: 0
                    appCacheTime: 0
                    dnsTime: 0
                    tcpTime: 0
                    sslTime: 0
                    requestTime: 42
                    responseTime: 1
                    processingTime: -1
                    onLoadTime: 1
                    backendTime: 51
                    frontendTime: -1
                    domTime: -1
                    childrenTime: 5
                    firstPaintTime: 331
                    firstContentfulPaintTime: 331
                    largestContentfulPaintTime: 331
                    firstInputDelayTime: -1
                    cumulativeLayoutShift: -1
                    cspBlockedUri: ''
                    cspEffectiveDirective: ''
                    cspOriginalPolicy: ''
                    cspDisposition: ''
                    cspSample: ''
                    cspSourceFile: ''
