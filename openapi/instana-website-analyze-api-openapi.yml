                    snippetVersion: '2'
                    httpCallHeaders: {}
                  cursor:
                    '@class': .IngestionOffsetCursor
                    ingestionTime: 1707023459959
                    offset: 1
              schema:
                $ref: '#/components/schemas/WebsiteBeaconResult'
          description: OK
        '401':
          description: Unauthorized access - requires user authentication.
        '500':
          description: Internal server error.
      security:
