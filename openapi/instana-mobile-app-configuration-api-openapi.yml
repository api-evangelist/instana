components:
  schemas:
    GeoSubdivision:
      type: object
      properties:
        code:
          type: string
          maxLength: 32
          minLength: 0
        name:
          type: string
          maxLength: 256
          minLength: 0
      required:
      - name
    SourceMapUploadConfigs:
      type: object
      properties:
        config:
          type: array
          items:
            $ref: '#/components/schemas/SourceMapUploadConfig'
          writeOnly: true
        configs:
          type: array
          items:
            $ref: '#/components/schemas/SourceMapUploadConfig'
          maxItems: 1024
          minItems: 0
      required:
      - configs
    SourceMapFileMeta:
      type: object
      properties:
        blobs:
          type: array
          items:
            $ref: '#/components/schemas/SourceMapFileBlob'
        format:
          type: string
        meta:
          type: string
        size:
          type: integer
          format: int64
        sizeOnDisk:
          type: integer
          format: int64
        type:
          type: string
          enum:
          - JS_MAP
          - JS
          - R8PG_MAP
          - DWARF
        url:
          type: string
      required:
      - format
      - type
      - url
    IpMaskingConfiguration:
      type: object
      properties:
        ipMasking:
          type: string
          enum:
          - DEFAULT
          - STRICT
          - REMOVE_ALL_DETAILS
      required:
      - ipMasking
    MobileApp:
      type: object
      properties:
        id:
          type: string
          maxLength: 128
          minLength: 0
        name:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - id
      - name
    ApiTag:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 256
          minLength: 0
        id:
          type: string
          maxLength: 64
          minLength: 0
      required:
      - displayName
      - id
    SourceMapUploadConfig:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        description:
          type: string
        id:
          type: string
        metadata:
          type: array
          items:
            $ref: '#/components/schemas/SourceMapFileMeta'
          maxItems: 500
          minItems: 0
        modifiedAt:
          type: string
          format: date-time
      required:
      - id
      - metadata
    GeoMappingRule:
      type: object
      properties:
        accuracyRadius:
          type: integer
          format: int64
          minimum: -1
        cidr:
          type: string
          maxLength: 128
          minLength: 0
        city:
          type: string
        continent:
          type: string
        continentCode:
          type: string
        country:
          type: string
        countryCode:
          type: string
        latitude:
          type: number
          format: double
        leastSpecificSubdivision:
          $ref: '#/components/schemas/GeoSubdivision'
        longitude:
          type: number
          format: double
        subdivisions:
          type: array
          items:
            $ref: '#/components/schemas/GeoSubdivision'
          maxItems: 8
          minItems: 0
      required:
      - cidr
      - subdivisions
    GeoLocationConfiguration:
      type: object
      properties:
        geoDetailRemoval:
          type: string
          enum:
          - NO_REMOVAL
          - REMOVE_COORDINATES
          - REMOVE_CITY
          - REMOVE_ALL
        geoMappingRules:
          type: array
          items:
            $ref: '#/components/schemas/GeoMappingRule'
          maxItems: 512
          minItems: 0
      required:
      - geoDetailRemoval
    SourceMapFileBlob:
      type: object
      properties:
        blobIndex:
          type: integer
          format: int32
        size:
          type: integer
          format: int64
        sizeOnDisk:
          type: integer
          format: int64
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: authorization
      type: apiKey
      description: "## Example\n\n```bash\ncurl --request GET \\\n  --url https://test-instana.instana.io/api/application-monitoring/catalog/metrics \\\n  --header 'authorization: apiToken xxxxxxxxxxxxxxxx'\n```\n"
