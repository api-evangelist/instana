        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InfraAlertConfig'
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                name: high-mean-memory-usage
                description: Something is going wrong in your infrastructure.
                severity: 5
                tagFilterExpression:
                  type: EXPRESSION
                  logicalOperator: AND
                  elements:
                  - type: TAG_FILTER
