- aid: instana:instana-synthetic-settings-api
  name: Instana Synthetic Settings API
  description: "The API endpoints of this group can be used to manage Synthetic Locations, Synthetic Tests\
    \ and Synthetic Credentials. \n\n## Synthetic Location Properties:\n- **id** Unique identifier of\
    \ the location resource.\n- **label** Friendly name of the location.\n- **description** The description\
    \ of the location.\n- **locationType** Indicates if the location is managed or private.\n- **playbackCapability**\
    \ The playback capabilities provided by this location resource.\n  The playbackCapability object has\
    \ the following properties: \n  - **syntheticType** Different types of synthetic tests that can be\
    \ executed at this location. \n    Possible values are HTTPAction, HTTPScript, BrowserScript, WebpageAction,\
    \ WebpageScript, SSLCertificate, and DNS. \n    The values are corresponding to the syntheticType\
    \ parameter available in the createSyntheticTest endpoint.\n  - **browserType** Different types of\
    \ supported Web browsers when creating synthetic tests for BrowserScript, WebpageAction and WebpageScript.\n\
    \    Right now, only Chrome and Firefox are supported. \n- **geoPoint** An object includes the longitude,\
    \ latitude, country name, and city name properties of a location. \n- **popVersion** PoP's version\n\
    - **customProperties** An object with name/value pairs to provide additional information of the Synthetic\
    \ location.\n- **createdAt** The location created time, following RFC3339 standard.\n- **modifiedAt**\
    \ The location modified time, following RFC3339 standard.\n- **observedAt** The timestamp when PoP\
    \ requests a Synthetic test, following RFC3339 standard.\n\n## Synthetic Test Properties:\n- **id**\
    \ Unique identifier of the Synthetic test resource.\n- **label** Friendly name of the Synthetic test\
    \ resource.\n- **description** The description of the Synthetic test.\n- **active** Indicates if the\
    \ Synthetic test is started or not. The default is true.\n- **applicationId** Unique identifier of\
    \ the Application Perspective.\n- **configuration** An object which has two properties: syntheticType\
    \ and the corresponding configuration object:\n    - **syntheticType** The type of the Synthetic test.\
    \ Supported values are HTTPAction, HTTScript, BrowserScript, WebpageAction,\n      WebpageScript,\
    \ SSLCertificate, and DNS. The locations assigned to execute this Synthetic\n      test must support\
    \ this syntheticType, i.e. the location's playbackCapabilities property.\n    - **markSyntheticCall**\
    \ Flag used to control if HTTP calls will be marked as synthetic calls/endpoints in Instana backend,\
    \ so they can be ignored when calculating service and application KPIs, users can also check \"Hide\
    \ Synthetic Calls\" checkbox to hide/show them in UI.\n    - **retries** An integer type from 0 to\
    \ 2, 0 by default.\n      It indicates how many attempts (max 2) will be allowed\n      to get a successful\
    \ connection (not necessarily a successful result).\n      For API Simple, failures like socket hangups,\
    \ gateway timeouts, and DNS lookup fails cause retires, but 404's 400's, do not.\n      API Script\
    \ and Browser Script test will retry if script failed for any reason.\n    - **retryInterval** The\
    \ time interval between retries in seconds. The default is 1s, max is 10s.\n    - **timeout** The\
    \ timeout to be used by the PoP playback engines running the test. Values are in integers followed\
    \ by a time unit (ms, s, m). \n      It is the minimum value of test configuration `timeout`, `testFrequency`\
    \ and `maxTimeout` configured in PoP deployment.\n        - If user defined timeout value exceeds\
    \ the `maxTimeout` or `testFrequency` in test configuration, the timeout value does not take effect\
    \ \n          and PoP playback engines use the smaller one of `maxTimeout` and `testFrequency` as\
    \ the actual timeout value.\n        - If timeout value in test configuration is not provided, the\
    \ default value is **1m** for HTTPAction and HTTPScript tests. \n          BrowserScript, WebpageAction,\
    \ and WebpageScript tests use the smaller one of `maxTimeout` and `testFrequency` as the actual timeout\
    \ value.\n    - **XXXConfiguration** The configuration corresponding to the syntheticType. Configuration\
    \ types are HTTPActionConfiguration, HTTPScriptConfiguration,\n      BrowserScriptConfiguration, WebpageActionConfiguration,\
    \ WebpageScriptConfiguration, SSLCertificateConfiguration, and DNSConfiguration. \n        - **HTTPActionConfiguration**\
    \ has the following properties:\n            - **url** The URL is being tested. It is required.\n\
    \            - **syntheticType** Its value is HTTPAction. It is required.\n            - **operation**\
    \ An operation being used must be one of GET, HEAD, OPTIONS, PATCH, POST, PUT, and DELETE. By default,\
    \ it is GET.\n            - **headers** An object with header/value pairs\n                - **header**\
    \ The header to be sent in operation. It should not contain the terminating ':' character.\n     \
    \           - **value** The value of the header.\n            - **body** The body content to send\
    \ with the operation.\n            - **validationString** An expression to be evaluated.\n       \
    \     - **followRedirect** A boolean type, true by default; to allow redirect.\n            - **allowInsecure**\
    \ A boolean type,  true by default; if set to true then allow insecure certificates\n            \
    \  (expired, self-signed, etc).\n            - **expectStatus** An integer type, by default, the Synthetic\
    \ passes for any 2XX status code.\n              This forces just one status code to cause a pass,\
    \ including what would normally be a fail, for example, a 404.\n            - **expectJson** An optional\
    \ object to be used to check against the test response object.\n            - **expectMatch** An optional\
    \ regular expression string to be used to check the test response.\n            - **expectExists**\
    \ An optional list of property labels used to check if they are present in the test response object.\n\
    \            - **expectNotEmpty** An optional list of property labels used to check if they are present\
    \ in the test response object with a non-empty value.\n        - **HTTPScriptConfiguration** has the\
    \ following properties:\n          - **script** The Javascript content, it is plain text, not base64\
    \ encoded. **script** and **scripts** are mutually exclusive.\n          - **scripts** Multi script\
    \ package. **script** and **scripts** are mutually exclusive.\n              - **scriptFile** The\
    \ name of the file to run\n              - **bundle** All required js files bundled up into a single\
    \ zip file with base64 encoded\n          - **syntheticType** Its value is HTTPScript. It is required.\n\
    \          - The API Script Guide, including examples, can be found at: https://www.ibm.com/docs/en/instana-observability/current?topic=monitoring-using-api-scripts\n\
    \        - **BrowserScriptConfiguration** has the following properties:\n          - **script** A\
    \ Node.js based test script, it is plain text, not base64 encoded. **script** and **scripts** are\
    \ mutually exclusive.\n          - **scripts** Multi script package. **script** and **scripts** are\
    \ mutually exclusive.\n              - **scriptFile** The name of the file to run\n              -\
    \ **bundle** All required js files bundled up into a single zip file with base64 encoded\n       \
    \   - **scriptType** The type of the script, right now, only Basic type is supported. \n         \
    \ - **browser** The type of the browser: chrome or firefox, chrome by default.\n          - **recordVideo**\
    \ A boolean type, false by default.\n          - **syntheticType** Its value is BrowserScript. It\
    \ is required.\n        - **WebpageActionConfiguration** has the following properties:\n         \
    \ - **url** The URL of the Web page being tested. It is required.\n          - **browser** The type\
    \ of the browser: chrome or firefox, chrome by default.\n          - **recordVideo** A boolean type,\
    \ false by default.\n          - **syntheticType** Its value is WebpageAction. It is required.\n \
    \       - **WebpageScriptConfiguration** has the following properties:\n          - **script** A Selenium\
    \ IDE recording script. It is required.\n          - **browser** The type of the browser: chrome or\
    \ firefox, chrome by default.\n          - **recordVideo** A boolean type, false by default.\n   \
    \       - **syntheticType** Its value is WebpageScript. It is required.\n        - **SSLCertificateConfiguration**\
    \ has the following properties:\n          - **hostname** The hostname of the SSL enabled website.\n\
    \          - **port** The SSL port, set to 443 by default.\n          - **daysRemainingCheck** The\
    \ number of days to use on the validation check. The test will fail when the certificate validity\
    \ has less than this number of days remaining until expiration.\n          - **acceptSelfSignedCertificate**\
    \ A boolean type, false by default, used to support self-signed certificates. \n        - **DNSConfiguration**\
    \ has the following properties:\n          - **acceptCNAME** A boolean type, false by default. When\
    \ enabled, the canonical name in the DNS response is accepted and no further lookups are performed.\n\
    \          - **lookup** The name or IP address of the host whose record is being queried.\n      \
    \    - **lookupServerName** A boolean type, false by default, that enables recursive DNS lookups.\n\
    \          - **port** The DNS server listening port, set to 53 by default.\n          - **queryTime**\
    \ An optional filter to be used to validate the test response time. \n            Syntax: \\<key\\\
    >\\<operator\\>\\<value\\>, where:\n              - **key** is the name of the property to be validated.\
    \ Only **responseTime** is supported.\n              - **operator** is one of EQUALS, GREATER_THAN,\
    \ LESS_THAN.\n              - **value** is a numeric value, in milliseconds, Default is 10000.\n \
    \         - **queryType** The DNS query type used in the test. Value must be one of ALL, ALL_CONDITIONS,\
    \ ANY, A, AAAA, CNAME, NS. Default value is A.\n              - If **ALL** is defined, all available\
    \ query types will be executed.\n              - If **ALL_CONDITIONS** is defined, only the query\
    \ types defined in **targetValues** will be executed.\n          - **recursiveLookups** A boolean\
    \ type, false by default, that enables recursive DNS lookups.\n          - **server** The IP address\
    \ of the DNS server.\n          - **serverRetries** The number of times to try a timed-out DNS lookup\
    \ before returning failure. Default is 1. \n          - **targetValues** An optional list of filters\
    \ to be used to validate the test response.\n            Syntax: [\\<key\\>\\<operator\\>\\<value\\\
    >, ...], where:\n              - **key** is the name of the property to be validated.\n          \
    \    - **operator** is one of CONTAINS, IS, MATCHES, NOT_MATCHES.\n              - **value** is the\
    \ expected property value.\n          - **transport** The protocol used to do DNS check. Only UDP\
    \ is supported.\n- **createdAt** The test created time, following RFC3339 standard.\n- **createdBy**\
    \ The user identifier who created the test resource.\n- **customProperties** An object with name/value\
    \ pairs to provide additional information of the Synthetic test.\n- **locations** It is an array of\
    \ the PoP location IDs where the Synthetic tests are located.\n- **applications** It is an array of\
    \ the unique identifiers of the Application Perspectives associated to this test.\n- **modifiedAt**\
    \ The test last updated time, following RFC3339 standard.\n- **modifiedBy** The user identifier who\
    \ updated the test resource.\n- **playbackMode** Defines how the Synthetic test should be executed\
    \ across multiple\n  PoPs. This property is optional, and its default value is Simultaneous, and only\
    \ Simultaneous is supported, i.e.,\n  Synthetic tests run at all locations simultaneously. \n- **testFrequency**\
    \ How often the playback for a Synthetic test is scheduled. The unit of the testFrequency parameter\
    \ is minute.\n  The default is every 15 minutes. The range is from 1 minute to 120 minutes. \n  For\
    \ SSLCertificate tests, the default is every 24 hours and the range is from 60 minute to 1440 minutes.\n\
    \n## Synthetic Credentials:\n\nSynthetic credentials can be used to store passwords and/or secrets\
    \ used by the Synthetic Tests.\n\nAll Script Tests can use credentials in their body and API Simple\
    \ Tests can use them on header parameters.\n\nIt is required that the credentials used in the test\
    \ be created before the test is created or modified.\n\nCredentials can be associated to multiple\
    \ Application Perspectives, Websites, and Mobile Apps.\n\nTests using credentials are validated during\
    \ test creation and update whether you use the API or UI, as follows:\n\n1. The user Id of the logged\
    \ in user or API Token being used to create or modify the test must have permission to use credentials.\
    \  \n  Requests to create or update a test referencing credentials without the correct permission\
    \ will fail with return code `Forbidden`.\n\n2. The credentials or secrets used in the test must exist.\
    \  \n  Requests to create or update a test referencing credentials that do not exist will fail with\
    \ return code `Bad Request`.\n\n3. Credentials associated to Application Perspectives, Websites, and\
    \ Mobile Apps can only be used by tests that are associated to at least one common Application Perspective,\
    \ Websites, and MobileApps.\n   Requests to create or update a test referencing credentials without\
    \ matching Application Perspectives, Websites, or Mobile Apps will fail with return code `Bad Request`."
