tags:
- name: Infrastructure Alert Configuration
paths:
  /api/events/settings/infra-alert-configs:
    get:
      description: Configs are sorted descending by their created date.
      operationId: findActiveInfraAlertConfigs
      parameters:
      - description: List of IDs of Infra Smart Alert configurations
        example: '[4kxgJAXdSDiu6swQaKXrJw, ZLo28grvQaiMqIaikJK1RQ]'
        in: query
        name: alertIds
        schema:
          type: array
          items:
            type: string
          maxItems: 1000
          minItems: 0
          uniqueItems: true
      responses:
        '200':
          content:
            application/json:
              example:
              - name: high-mean-memory-usage
                description: Something is going wrong in your infrastructure.
                severity: 5
                tagFilterExpression:
                  type: EXPRESSION
                  logicalOperator: AND
                  elements:
                  - type: TAG_FILTER
                    name: kubernetes.cluster.name
                    stringValue: 200_PoP_Cluster
                    numberValue: null
                    booleanValue: null
                    key: null
                    value: 200_PoP_Cluster
                    operator: EQUALS
                    entity: NOT_APPLICABLE
                groupBy:
                - kubernetes.cluster.name
                - kubernetes.namespace.name
                - kubernetes.pod.name
                rule:
                  alertType: genericRule
                  metricName: memory.usage
                  entityType: crio
                  aggregation: MEAN
                  crossSeriesAggregation: MEAN
                  regex: false
                threshold:
                  type: staticThreshold
                  operator: '>='
                  value: 1
                  lastUpdated: 1724720573744
                forecastingConfig: null
                alertChannelIds:
                - VjS1NvcXpOARmTvA
                - CrLI3QeIZKygaNLH
                granularity: 60000
                timeThreshold:
                  type: violationsInSequence
                  timeWindow: 180000
                id: 4kxgJAXdSDiu6swQaKXrJw
                created: 1724720587414
                initialCreated: 1714766649532
                readOnly: false
                enabled: false
                customPayloadFields:
                - type: staticString
                  key: testKey
                  value: team-ar
                rules:
                - thresholdOperator: '>='
                  rule:
                    alertType: genericRule
                    metricName: memory.usage
                    entityType: crio
                    aggregation: MEAN
                    crossSeriesAggregation: MEAN
                    regex: false
                  thresholds:
                    WARNING:
                      type: staticThreshold
                      value: 1
                    CRITICAL:
                      type: staticThreshold
                      value: 4
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InfraAlertConfigWithMetadata'
          description: OK
      security:
      - ApiKeyAuth:
        - Default
      summary: All Infra Alert Configs
      tags:
      - Infrastructure Alert Configuration
      x-ibm-ahub-byok: true
    post:
      operationId: createInfraAlertConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InfraAlertConfig'
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                name: high-mean-memory-usage
                description: Something is going wrong in your infrastructure.
                severity: 5
                tagFilterExpression:
                  type: EXPRESSION
                  logicalOperator: AND
                  elements:
                  - type: TAG_FILTER
                    name: kubernetes.cluster.name
                    stringValue: 200_PoP_Cluster
                    numberValue: null
                    booleanValue: null
                    key: null
                    value: 200_PoP_Cluster
                    operator: EQUALS
                    entity: NOT_APPLICABLE
                groupBy:
                - kubernetes.cluster.name
                - kubernetes.namespace.name
                - kubernetes.pod.name
                rule:
                  alertType: genericRule
                  metricName: memory.usage
                  entityType: crio
                  aggregation: MEAN
                  crossSeriesAggregation: MEAN
                  regex: false
                threshold:
                  type: staticThreshold
                  operator: '>='
                  value: 1
                  lastUpdated: 1724720573744
                forecastingConfig: null
                alertChannelIds:
                - VjS1NvcXpOARmTvA
                - CrLI3QeIZKygaNLH
                granularity: 60000
                timeThreshold:
                  type: violationsInSequence
                  timeWindow: 180000
                id: 4kxgJAXdSDiu6swQaKXrJw
                created: 1724720587414
                initialCreated: 1714766649532
                readOnly: false
                enabled: false
                customPayloadFields:
                - type: staticString
                  key: testKey
                  value: team-ar
                rules:
                - thresholdOperator: '>='
                  rule:
                    alertType: genericRule
                    metricName: memory.usage
                    entityType: crio
                    aggregation: MEAN
                    crossSeriesAggregation: MEAN
                    regex: false
                  thresholds:
                    WARNING:
                      type: staticThreshold
                      value: 1
                    CRITICAL:
                      type: staticThreshold
                      value: 4
              schema:
                $ref: '#/components/schemas/InfraAlertConfigWithMetadata'
          description: OK
        '403':
          description: Insufficient permissions.
      security:
      - ApiKeyAuth:
        - CanConfigureGlobalInfraSmartAlerts
      summary: Create Infra Alert Config
      tags:
      - Infrastructure Alert Configuration
      x-ibm-ahub-byok: true
