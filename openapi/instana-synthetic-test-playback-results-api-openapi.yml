  /api/synthetics/results/{testid}/{testresultid}/file:
    get:
      operationId: getSyntheticResultDetailDataFile
      parameters:
      - description: Test id of the test result detailed file to be retrieved
        example: AMl0Y7tsvpp8XXrXt1XO
        in: path
        name: testid
        required: true
        schema:
          type: string
      - description: Test result id of the  test result detailed file to be retrieved
        example: 5623c161-31d6-49b8-b314-91d4fb598f55
        in: path
        name: testresultid
        required: true
        schema:
          type: string
      - description: Type of the test result detailed file
        example: LOGS
        in: query
        name: type
        required: true
        schema:
          type: string
          enum:
          - HAR
          - IMAGES
          - LOGS
          - SUBTRANSACTIONS
          - VIDEOS
      - description: Start time of the test result detailed file
        example: 1730295066008
        in: query
        name: startTime
        schema:
          type: integer
          format: int64
      responses:
        '200':
          content:
            application/octet-stream: {}
          description: OK
        '401':
          description: Unauthorized access - requires user authentication.
        '403':
          description: Insufficient permissions.
        '404':
          description: Resource not found.
        '500':
          description: Internal server error.
      security:
      - ApiKeyAuth:
        - Default
      summary: Download the synthetic test playback result detail data file
      tags:
      - Synthetic Test Playback Results
      x-ibm-ahub-byok: true
components:
  schemas:
    TestResultListResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TestResultListItem'
        page:
          type: integer
          format: int32
          description: Page Number
          minimum: 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
        totalHits:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
    TestLastError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
        startTime:
          type: integer
          format: int64
    TestResultMetadata:
      type: object
      properties:
        metadata:
          type: object
          additionalProperties:
            type: object
        startTime:
          type: integer
          format: int64
        testId:
          type: string
        testResultId:
          type: string
      required:
      - testId
    TestResultSubtransaction:
      type: object
      properties:
        metrics:
          type: object
          additionalProperties:
            type: object
        properties:
          type: object
          additionalProperties:
            type: object
      required:
      - metrics
      - properties
    LocationStatus:
      type: object
      properties:
        locationDisplayLabel:
          type: string
        locationId:
          type: string
        successRate:
          type: number
          format: double
        successRuns:
          type: integer
          format: int64
        totalTestRuns:
          type: integer
          format: int64
      required:
      - locationId
    Order:
      type: object
      description: 'Specifies the ordering of the results.

        It contains fields that define the sorting criteria, the collation for sorting, and the direction in which the results should be ordered.

        '
      properties:
        by:
          type: string
          description: If the granularity is set to `1` you can use the metric name eg. `latency.p95` to order by that value.
        collation:
          type: string
          description: Language code used for sorting. Ignored for infrastructure queries.
        direction:
          type: string
          description: The order in which results will be sorted, either `ASC` for ascending or `DESC` for descending.
          enum:
          - ASC
          - DESC
      required:
      - by
      - direction
    TimeFrame:
      type: object
      description: Time range for which the data should be retrieved.
      properties:
        to:
          type: integer
          format: int64
          description: 'end of timeframe expressed as the Unix epoch time in milliseconds. Eg: `ISO 8601` standard time `2024-06-27T05:05:55.615Z` can be represented as `1719464755615` in Unix epoch time in milliseconds.'
        windowSize:
          type: integer
          format: int64
          description: windowSize in milliseconds
          maximum: 2678400000
          minimum: 0
    GetTestResultAnalytic:
      type: object
      properties:
        analyticFunction:
          type: string
        includeLocationIdGrouping:
          type: boolean
          writeOnly: true
        order:
          $ref: '#/components/schemas/Order'
        pagination:
          $ref: '#/components/schemas/Pagination'
        syntheticMetrics:
          type: array
          items:
            type: string
        tagFilterExpression:
          $ref: '#/components/schemas/TagFilterExpressionElement'
        tagFilters:
          type: array
          items:
            $ref: '#/components/schemas/TagFilter'
        timeFrame:
          $ref: '#/components/schemas/TimeFrame'
      required:
      - analyticFunction
      - syntheticMetrics
    TestResult:
      type: object
      properties:
        testResult:
          type: array
          items:
            $ref: '#/components/schemas/TestResultItem'
        testResultItems:
          type: array
          items:
            $ref: '#/components/schemas/TestResultItem'
          writeOnly: true
    GetTestResultBase:
      type: object
      properties:
        order:
          $ref: '#/components/schemas/Order'
        pagination:
          $ref: '#/components/schemas/Pagination'
        tagFilterExpression:
          $ref: '#/components/schemas/TagFilterExpressionElement'
        tagFilters:
          type: array
          items:
            $ref: '#/components/schemas/TagFilter'
        timeFrame:
          $ref: '#/components/schemas/TimeFrame'
    GetTestResult:
      type: object
      properties:
        applicationId:
          type: string
          maxLength: 64
          minLength: 0
        locationId:
          type: array
          items:
            type: string
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/SyntheticMetricConfiguration'
        order:
          $ref: '#/components/schemas/Order'
        pagination:
          $ref: '#/components/schemas/Pagination'
        serviceId:
          type: string
          maxLength: 64
          minLength: 0
        tagFilterExpression:
          $ref: '#/components/schemas/TagFilterExpressionElement'
        tagFilters:
          type: array
          items:
            $ref: '#/components/schemas/TagFilter'
        testId:
          type: array
          items:
            type: string
        timeFrame:
          $ref: '#/components/schemas/TimeFrame'
      required:
      - metrics
    TestResultListItem:
      type: object
      properties:
        metrics:
          type: object
          additionalProperties:
            type: array
            items:
              type: array
              items:
                type: number
        testResultCommonProperties:
          $ref: '#/components/schemas/TestResultCommonProperties'
      required:
      - metrics
      - testResultCommonProperties
    TestResultDetailData:
      type: object
      properties:
        har:
          type: object
          additionalProperties:
            type: object
        imageFiles:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              format: byte
        logFiles:
          type: object
          additionalProperties:
            type: string
        logs:
          type: string
        subtransactionAvgMetrics:
          type: object
          additionalProperties:
            type: object
        subtransactions:
          type: array
          items:
            $ref: '#/components/schemas/TestResultSubtransaction'
        testId:
          type: string
        testResultId:
          type: string
        videos:
          type: array
          items:
            type: string
            format: byte
    TagFilterExpressionElement:
      type: object
      description: Boolean expression of tag filters to define the scope of relevant calls.
      discriminator:
        mapping:
          EXPRESSION: '#/components/schemas/TagFilterExpression'
          TAG_FILTER: '#/components/schemas/TagFilter'
        propertyName: type
      properties:
        type:
          type: string
      required:
      - type
    TestResultCommonProperties:
      type: object
      properties:
        clientId:
          type: string
        customTags:
          type: object
          additionalProperties:
            type: string
        dnsQueryType:
          type: string
        dnsServerName:
          type: string
        errors:
          type: array
          items:
            type: string
        id:
          type: string
        ismDetails:
          type: object
          additionalProperties:
            type: string
        lastErrors:
          $ref: '#/components/schemas/TestLastError'
        locationDisplayLabel:
          type: string
        locationId:
          type: string
        runType:
          type: string
        sslDaysRemaining:
          type: string
        testCommonProperties:
          $ref: '#/components/schemas/TestCommonProperties'
        testId:
          type: string
        testLastError:
          $ref: '#/components/schemas/TestLastError'
        testName:
          type: string
      required:
      - clientId
      - testId
    TagFilter:
      type: object
      allOf:
      - $ref: '#/components/schemas/TagFilterExpressionElement'
      - type: object
        properties:
          entity:
            type: string
            description: SOURCE or DESTINATION tag in case of a call tag. For Infrastructure, always set to NOT_APPLICABLE.
            enum:
            - NOT_APPLICABLE
            - DESTINATION
            - SOURCE
          key:
            type: string
            description: Tag key in case of a key/value tag.
            maxLength: 512
            minLength: 0
          name:
            type: string
            description: Name of the tag.
            maxLength: 128
            minLength: 0
          operator:
            type: string
            enum:
            - EQUALS
            - CONTAINS
            - LESS_THAN
            - LESS_OR_EQUAL_THAN
            - GREATER_THAN
            - GREATER_OR_EQUAL_THAN
            - NOT_EMPTY
            - NOT_EQUAL
            - NOT_CONTAIN
            - IS_EMPTY
            - NOT_BLANK
            - IS_BLANK
            - STARTS_WITH
            - ENDS_WITH
            - NOT_STARTS_WITH
            - NOT_ENDS_WITH
            - REGEX_MATCH
          value:
            type: object
            description: Tag value to filter on. Can be a string, number, or boolean value.
      required:
      - entity
      - name
      - operator
    SyntheticMetricConfiguration:
      type: object
      properties:
        aggregation:
          type: string
          description: 'Set aggregation that can be applied to a series of values. Eg: `MEAN`.'
          enum:
          - SUM
          - MEAN
          - MAX
          - MIN
          - P25
          - P50
          - P75
          - P90
          - P95
          - P98
          - P99
          - P99_9
          - P99_99
          - DISTINCT_COUNT
          - SUM_POSITIVE
          - PER_SECOND
          - INCREASE
        granularity:
          type: integer
          format: int32
          description: 'If the granularity is set you will get data points with the specified granularity in seconds. Default: `1000` milliseconds'
        metric:
          type: string
          description: 'Set a particular metric, eg: `latency`.'
      required:
      - aggregation
      - metric
    Pagination:
      type: object
      properties:
        page:
          type: integer
          format: int32
          description: Page number for a specific page in the results. For example, if you'd like to retrieve the 5th page out of 10 pages, the value would be 5.
          minimum: 1
        pageSize:
          type: integer
          format: int32
          description: 'Set the number of items you want to return with one query. Eg: if you want to retrieve 10 items, the value would be 10.'
          maximum: 200
          minimum: 1
    GetTestResultList:
      type: object
      properties:
        applicationId:
          type: string
          maxLength: 64
          minLength: 0
        order:
          $ref: '#/components/schemas/Order'
        pagination:
          $ref: '#/components/schemas/Pagination'
        syntheticMetrics:
          type: array
          items:
            type: string
        tagFilterExpression:
          $ref: '#/components/schemas/TagFilterExpressionElement'
        tagFilters:
          type: array
          items:
            $ref: '#/components/schemas/TagFilter'
        timeFrame:
          $ref: '#/components/schemas/TimeFrame'
      required:
      - syntheticMetrics
    GetTestSummaryResult:
      type: object
      properties:
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/SyntheticMetricConfiguration'
        order:
          $ref: '#/components/schemas/Order'
        pagination:
          $ref: '#/components/schemas/Pagination'
        tagFilterExpression:
          $ref: '#/components/schemas/TagFilterExpressionElement'
        tagFilters:
          type: array
          items:
            $ref: '#/components/schemas/TagFilter'
        timeFrame:
          $ref: '#/components/schemas/TimeFrame'
      required:
      - metrics
    TestResultItem:
      type: object
      properties:
        applicationId:
          type: string
        applicationIds:
          type: array
          items:
            type: string
        customTags:
          type: object
          additionalProperties:
            type: string
        locationId:
          type: array
          items:
            type: string
        metrics:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
        mobileApplicationIds:
          type: array
          items:
            type: string
        serviceId:
          type: string
        testId:
          type: string
        testName:
          type: string
        websiteIds:
          type: array
          items:
            type: string
      required:
      - testId
    TestCommonProperties:
      type: object
      properties:
        active:
          type: boolean
        applicationId:
          type: string
        applicationIds:
          type: array
          items:
            type: string
        applicationLabel:
          type: string
        applicationLabels:
          type: array
          items:
            type: string
        createdAt:
          type: integer
          format: int64
        frequency:
          type: integer
          format: int32
        getWebsiteLabels:
          type: array
          items:
            type: string
        id:
          type: string
        label:
          type: string
        locationDisplayLabels:
          type: array
          items:
            type: string
        locationIds:
          type: array
          items:
            type: string
        locationLabels:
          type: array
          items:
            type: string
        locationStatusList:
          type: array
          items:
            $ref: '#/components/schemas/LocationStatus'
        mobileApplicationIds:
          type: array
          items:
            type: string
        mobileApplicationLabels:
          type: array
          items:
            type: string
        modifiedAt:
          type: integer
          format: int64
        serviceId:
          type: string
        type:
          type: string
        websiteIds:
          type: array
          items:
            type: string
        websiteLabels:
          type: array
          items:
            type: string
          writeOnly: true
      required:
      - active
      - frequency
      - id
      - label
      - type
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: authorization
      type: apiKey
      description: "## Example\n\n```bash\ncurl --request GET \\\n  --url https://test-instana.instana.io/api/application-monitoring/catalog/metrics \\\n  --header 'authorization: apiToken xxxxxxxxxxxxxxxx'\n```\n"
