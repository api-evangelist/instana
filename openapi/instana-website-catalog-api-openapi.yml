openapi: 3.2.0
info:
  contact:
    email: support@instana.com
    name: © Instana
    url: http://instana.com
  termsOfService: https://www.instana.com/terms-of-use/
  title: Instana REST API documentation Website Catalog API
  version: 1.307.1417
  x-ibm-ahub-try: true
  x-logo:
    altText: instana logo
    backgroundColor: '#FAFBFC'
    url: header-logo.svg
  description: Searching for answers and best pratices?
servers:
- description: Instana Backend
  url: https://{unit}-{tenant}.instana.io
  variables:
    tenant:
      default: tenant
      description: Customer tenant unit
    unit:
      default: unit
      description: Customer tenant name
- description: Instana Self-Hosted Backend
  url: https://{domain}
  variables:
    domain:
      default: example.com
      description: Customer Self-Hosted domain
tags:
- name: Website Catalog
  description: The endpoints of this group retrieve all available resources to query website metrics.
paths:
  /api/website-monitoring/catalog:
    get:
      operationId: getWebsiteTagCatalog
      parameters:
      - description: beaconType
        example: pageLoad
        in: query
        name: beaconType
        required: true
        schema:
          type: string
      - description: useCase
        example: GROUPING
        in: query
        name: useCase
        required: true
        schema:
          type: string
          enum:
          - GROUPING
          - FILTERING
          - SERVICE_MAPPING
          - SMART_ALERTS
          - SMART_ALERTS_LOGS
          - SMART_ALERTS_ADAPTIVE_BASELINE
          - SMART_ALERTS_CUSTOM_PAYLOAD
          - SLI_MANAGEMENT
          - APPLICATION_CONFIG
          - APPLICATION_CONFIG_BLUEPRINT
          - MAINTENANCE_WINDOWS
          - BIZOPS_CUSTOM_DASHBOARDS_FILTERING
      responses:
        '200':
          content:
            application/json:
              example:
                tagTree:
                - label: Commonly Used
                  description: null
                  icon: null
                  children:
                  - label: Website Label
                    description: Name of the website as configured within the Instana user interface.
                    tagName: beacon.website.name
                    type: TAG
                tags:
                - name: beacon.type
                  label: Beacon Type
                  type: STRING
                  description: null
                  canApplyToSource: false
                  canApplyToDestination: false
                  idTag: false
              schema:
                $ref: '#/components/schemas/TagCatalog'
          description: OK
        '400':
          description: When the combination of beaconType and useCase is unsupported/unknown.
        '401':
          description: Unauthorized access - requires user authentication.
        '500':
          description: Internal server error.
      security:
      - ApiKeyAuth:
        - Default
      summary: Get website tag catalog
      tags:
      - Website Catalog
      x-ibm-ahub-byok: true
  /api/website-monitoring/catalog/metrics:
    get:
      operationId: getWebsiteCatalogMetrics
      responses:
        '200':
          content:
            application/json:
              example:
              - metricId: beaconDuration
                label: Beacon duration
                formatter: LATENCY
                description: The recorded duration for a beacon.
                aggregations:
                - P25
                - MEAN
                - MAX
                - P95
                - P90
                - SUM
                - P98
                - P99
                - MIN
                - P75
                - P50
                defaultAggregation: null
                beaconTypes:
                - pageLoad
                - resourceLoad
                - custom
                - httpRequest
                pathToValueInBeacon:
                - duration
                tagName: beacon.duration
              - metricId: pageLoads
                label: Page loads
                formatter: NUMBER
                description: How often a full page load occurred. This typically requires retrieval of an HTML document from a server (unless cached) and then the full onLoad cycle.
                aggregations:
                - SUM
                defaultAggregation: null
                beaconTypes:
                - pageLoad
                pathToValueInBeacon: null
                tagName: null
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebsiteMonitoringMetricDescription'
          description: OK
        '401':
          description: Unauthorized access - requires user authentication.
        '500':
          description: Internal server error.
      security:
      - ApiKeyAuth:
        - Default
      summary: Metric catalog
      tags:
      - Website Catalog
      x-ibm-ahub-byok: true
      description: This endpoint retrieves all available metric definitions for website monitoring.
  /api/website-monitoring/catalog/tags:
    get:
      operationId: getWebsiteCatalogTags
      responses:
        '200':
          content:
            application/json:
              example:
              - name: beacon.sessionId
                type: STRING
                category: WEBSITE
                canApplyToSource: false
                canApplyToDestination: false
                sourceValueAvailableFrom: 0
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
          description: OK
        '401':
          description: Unauthorized access - requires user authentication.
        '500':
          description: Internal server error.
      security:
      - ApiKeyAuth:
        - Default
      summary: Get all existing website tags
      tags:
      - Website Catalog
      x-ibm-ahub-byok: true
      description: 'This endpoint retrieves all available tags for your monitored system.


        These tags can be used to group metric results.

        ```

        "group": {

        "groupbyTag": "beacon.page.name"

        }

        ```


        These tags can be used to filter metric results.

        ```

        "tagFilters": [{

        "name": "beacon.website.name",

        "operator": "EQUALS",

        "value": "example"

        }]

        ```'
components:
  schemas:
    WebsiteMonitoringMetricDescription:
      type: object
      properties:
        aggregations:
          type: array
          description: 'The types of aggregations that can be applied to a series of values.

            For example, `P25` is 25th percentile. Note that not all aggregations are available for metrics.

            For example, `Trace count` has only `SUM` as an aggregation whereas `Call Count` has two aggregations, `SUM` and `PER_SECOND`.

            '
          items:
            type: string
            description: 'The types of aggregations that can be applied to a series of values.

              For example, `P25` is 25th percentile. Note that not all aggregations are available for metrics.

              For example, `Trace count` has only `SUM` as an aggregation whereas `Call Count` has two aggregations, `SUM` and `PER_SECOND`.

              '
            enum:
            - SUM
            - MEAN
            - MAX
            - MIN
            - P25
            - P50
            - P75
            - P90
            - P95
            - P98
            - P99
            - P99_9
            - P99_99
            - DISTINCT_COUNT
            - SUM_POSITIVE
            - PER_SECOND
            - INCREASE
          uniqueItems: true
        beaconTypes:
          type: array
          items:
            type: string
          uniqueItems: true
        defaultAggregation:
          type: string
          description: The preselected aggregation for a metric. For example, for `Call latency` the default aggregation is `MEAN`.
          enum:
          - SUM
          - MEAN
          - MAX
          - MIN
          - P25
          - P50
          - P75
          - P90
          - P95
          - P98
          - P99
          - P99_9
          - P99_99
          - DISTINCT_COUNT
          - SUM_POSITIVE
          - PER_SECOND
          - INCREASE
        description:
          type: string
          description: A description of the metric. For example, for `Call count` metric, the description would be something like `Number of received calls`
        formatter:
          type: string
          description: '* `NUMBER`: Generic number

            * `BYTES`: Number of bytes

            * `KILO_BYTES`: Number of kilobytes

            * `MEGA_BYTES`: Number of megabytes

            * `PERCENTAGE`: Percentage in scale [0,1]

            * `PERCENTAGE_100`: Percentage in scale [0,100]

            * `PERCENTAGE_NO_CAPPING`: Percentage in scale [0,1] but value could exceed 1 for example when metric is aggregated

            * `PERCENTAGE_100_NO_CAPPING`: Percentage in scale [0,100] but value could exceed 100 for example when metric is aggregated

            * `LATENCY`: Time in milliseconds, with value of 0 should not be considered a a strict 0, but considered as < 1ms

            * `NANOS`: Time in nanoseconds

            * `MILLIS`: Time in milliseconds

            * `MICROS`: Time in microseconds

            * `SECONDS`: Time in seconds

            * `RATE`: Number of occurrences per second

            * `BYTE_RATE`: Number of bytes per second

            * `UNDEFINED`: Metric value unit is not known

            '
        label:
          type: string
          description: The name of the metric. For example, `Call count`, `Erroneous calls`, `Service count` etc.
        metricId:
          type: string
          description: The unique id of the metric. For example, `calls`, `erroneousCalls`, `latency` etc.
        pathToValueInBeacon:
          type: array
          items:
            type: string
          maxItems: 2147483647
          minItems: 1
        tagName:
          type: string
      required:
      - aggregations
      - beaconTypes
      - formatter
      - label
      - metricId
    TagTreeLevel:
      type: object
      description: 'The name of the tag dataset (tagTree) which can contain one or more tags as its attributes or children. Eg: `Call`.

        Consider this as the root of the tree where it has tags as attributes or children.

        '
      properties:
        children:
          type: array
          description: Children tags of tagTree
          items:
            $ref: '#/components/schemas/TagTreeNode'
        description:
          type: string
          description: The description provided, if any.
          maxLength: 512
          minLength: 0
        icon:
          type: string
          description: 'Each tag has an Icon which can be seen on the drop down list in Unbounded Analytics.

            If there is an icon, there will be a string associated with it.

            Eg: For for all `TAG` under `Call` tagTreeNode, the `icon` value is `lib_application_call`.

            '
          maxLength: 128
          minLength: 0
        label:
          type: string
          description: 'The name of the tagTreeNode. Eg: `Commonly Used`, `Application`.'
          maxLength: 128
          minLength: 0
        queryable:
          type: boolean
        scoreBoost:
          type: integer
          format: int32
          description: 'By default it is `null` if it is not set explictily by IBM Instana.

            The purpose of this parameter is to rank the tagTree. For eg: some set of tags are frequently used.

            Tags under `Commonly used` is frequently used, so it will come up on top of the drop down list of `Query Builder` in `Unbounded Analytics`.

            Higher the scoreBoost, higher the ranking.

            '
        type:
          type: string
          description: Type would be either `LEVEL` or `TAG` depending on whether the tag has any child tags or not respectively.
      required:
      - children
      - label
    TagCatalog:
      type: object
      properties:
        tagTree:
          type: array
          description: 'The name of the tag dataset (tagTree) which can contain one or more tags as its attributes or children. Eg: `Call`.

            Consider this as the root of the tree where it has tags as attributes or children.

            '
          items:
            $ref: '#/components/schemas/TagTreeLevel'
        tags:
          type: array
          description: 'List of queryable tags available in a tagTree. Eg: `call.erroneous`.

            Consider these tags as attributes of a tagTree. Eg: `Call` tagTree has have `Erroneous`, `Call name`, `Latency` etc as attributes.

            '
          items:
            $ref: '#/components/schemas/Tag'
      required:
      - tagTree
      - tags
    TagTreeNode:
      type: object
      description: Children tags of tagTree
      discriminator:
        mapping:
          LEVEL: '#/components/schemas/TagTreeLevel'
          TAG: '#/components/schemas/TagTreeTag'
        propertyName: type
      properties:
        icon:
          type: string
        label:
          type: string
        type:
          type: string
          description: Type would be either `LEVEL` or `TAG` depending on whether the tag has any child tags or not respectively.
    Tag:
      type: object
      description: 'List of queryable tags available in a tagTree. Eg: `call.erroneous`.

        Consider these tags as attributes of a tagTree. Eg: `Call` tagTree has have `Erroneous`, `Call name`, `Latency` etc as attributes.

        '
      properties:
        aliases:
          type: array
          description: 'List of other names that can refer to this tag

            '
          items:
            type: string
            description: 'List of other names that can refer to this tag

              '
          uniqueItems: true
        availability:
          type: array
          description: 'List of product areas this tag is available in

            '
          items:
            type: string
            description: 'List of product areas this tag is available in

              '
            enum:
            - INFRASTRUCTURE_METRICS
            - APPLICATION
            - WEBSITE
            - MOBILE_APP
            - EUM
            - EUM_IMPACTED_BEACON
            - EVENT
            - SLI
            - SLO
            - SLO_PREVIEW
            - USAGE
            - LOG
            - SYNTHETICS
            - SYNTHETICS_DETAIL
            - APDEX
            - BIZOPS
            - BUSINESS_METRICS
            - SUBTRACE
            - UNKNOWN
          uniqueItems: true
        canApplyToDestination:
          type: boolean
          description: 'Whether the tag is available for destination or not.

            If source and destination is false, it means the tag is independent of source and destination. Eg: of such tag is `call.http.path`.

            '
        canApplyToSource:
          type: boolean
          description: 'Whether the tag is available for source or not.

            If source and destination is false, it means the tag is independent of source and destination. Eg: of such tag is `call.http.path`.

            '
        description:
          type: string
          description: The description of the tag if it is provided.
        idTag:
          type: boolean
          description: 'Whether the Tag is a unique ID or not.

            Eg: `idTag` for `endpoint.id` is true but for `call.rpc.method` it is false.

            '
        label:
          type: string
          description: 'The name of the tag which is seen in the UI. Eg: `Call name`'
          maxLength: 256
          minLength: 0
        name:
          type: string
          description: 'The name of the tag. Eg: `call.name`'
        type:
          type: string
          description: 'The data type of the tag. Eg: `call.name` accepts `STRING` value.'
          enum:
          - BOOLEAN
          - STRING
          - NUMBER
          - STRING_SET
          - STRING_LIST
          - KEY_VALUE_PAIR
          - FLOAT_LIST
          - KEY_NUMBER_PAIR
      required:
      - name
      - type
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: authorization
      type: apiKey
      description: "## Example\n\n```bash\ncurl --request GET \\\n  --url https://test-instana.instana.io/api/application-monitoring/catalog/metrics \\\n  --header 'authorization: apiToken xxxxxxxxxxxxxxxx'\n```\n"
