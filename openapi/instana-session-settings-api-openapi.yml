openapi: 3.2.0
info:
  contact:
    email: support@instana.com
    name: © Instana
    url: http://instana.com
  termsOfService: https://www.instana.com/terms-of-use/
  title: Instana REST API documentation Session Settings API
  version: 1.307.1417
  x-ibm-ahub-try: true
  x-logo:
    altText: instana logo
    backgroundColor: '#FAFBFC'
    url: header-logo.svg
  description: Searching for answers and best pratices?
servers:
- description: Instana Backend
  url: https://{unit}-{tenant}.instana.io
  variables:
    tenant:
      default: tenant
      description: Customer tenant unit
    unit:
      default: unit
      description: Customer tenant name
- description: Instana Self-Hosted Backend
  url: https://{domain}
  variables:
    domain:
      default: example.com
      description: Customer Self-Hosted domain
tags:
- name: Session Settings
paths:
  /api/settings/session:
    delete:
      description: Delete tenant unit session settings.
      operationId: deleteSessionSettings
      responses:
        default:
          content:
            application/json: {}
          description: default response
      security:
      - ApiKeyAuth:
        - CanConfigureSessionSettings
      summary: Delete session settings
      tags:
      - Session Settings
      x-ibm-ahub-byok: true
    get:
      description: Get the tenant unit session settings
      operationId: getSessionSettings
      responses:
        '200':
          content:
            application/json:
              example: "{\n  tokenLifeTimeInMillis: 28800000,\n  idleTimeInMillis: 3600000\n}\n"
              schema:
                $ref: '#/components/schemas/SessionSettings'
          description: OK
      security:
      - ApiKeyAuth:
        - CanConfigureSessionSettings
      summary: Get session settings
      tags:
      - Session Settings
      x-ibm-ahub-byok: true
    put:
      description: Update individual tenant unit session settings.
      operationId: setSessionSettings
      requestBody:
        content:
          application/json:
            example: "{\n  tokenLifeTimeInMillis: 28800000,\n  idleTimeInMillis: 3600000\n}\n"
            schema:
              $ref: '#/components/schemas/SessionSettings'
      responses:
        '200':
          content:
            application/json:
              example: "{\n  tokenLifeTimeInMillis: 28800000,\n  idleTimeInMillis: 3600000\n}\n"
              schema:
                $ref: '#/components/schemas/SessionSettings'
          description: OK
      security:
      - ApiKeyAuth:
        - CanConfigureSessionSettings
      summary: Configure session settings
      tags:
      - Session Settings
      x-ibm-ahub-byok: true
components:
  schemas:
    SessionSettings:
      type: object
      properties:
        idleTimeInMillis:
          type: integer
          format: int64
          maximum: 28800000
          minimum: 600000
        tokenLifeTimeInMillis:
          type: integer
          format: int64
          maximum: 604800000
          minimum: 600000
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: authorization
      type: apiKey
      description: "## Example\n\n```bash\ncurl --request GET \\\n  --url https://test-instana.instana.io/api/application-monitoring/catalog/metrics \\\n  --header 'authorization: apiToken xxxxxxxxxxxxxxxx'\n```\n"
