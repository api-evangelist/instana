  /api/website-monitoring/v2/metrics:
    post:
      description: API request to get website monitoring beacon metrics.
      operationId: getBeaconMetricsV2
      requestBody:
        content:
          application/json:
            example:
              metrics:
              - metric: beaconCount
                aggregation: SUM
              tagFilterExpression:
                type: EXPRESSION
                logicalOperator: AND
                elements:
                - type: TAG_FILTER
                  name: beacon.website.name
                  operator: EQUALS
                  entity: NOT_APPLICABLE
                  value: robot-shop
                - type: TAG_FILTER
                  name: beacon.location.path
                  operator: EQUALS
                  entity: NOT_APPLICABLE
                  value: /
              timeFrame:
                to: null
                windowSize: 3600000
              type: PAGELOAD
            schema:
              $ref: '#/components/schemas/GetWebsiteMetricsV2'
      responses:
        '200':
          content:
            application/json:
              example:
                metrics:
                  beaconCount.sum:
                  - - 1706856180000
                    - 100
                adjustedTimeFrame:
                  windowSize: 3540000
                  to: 1706856180000
              schema:
                $ref: '#/components/schemas/MetricAPIResult'
          description: OK
        '401':
          description: Unauthorized access - requires user authentication.
        '404':
          description: Resource not found.
        '422':
          description: Unprocessable request - missing/invalid data.
        '500':
          description: Internal server error.
      security:
      - ApiKeyAuth:
        - Default
      summary: Get beacon metrics
      tags:
      - Website Metrics
      x-ibm-ahub-byok: true
