                windowWidth: 1149
                windowHeight: 1008
                latitude: 50.8021
                longitude: 8.7857
                accuracyRadius: 200
                city: Weidenhausen
                subdivision: Hesse
                subdivisionCode: HE
                country: Germany
                countryCode: DE
                continent: Europe
                continentCode: EU
                httpCallUrl: ''
                httpCallOrigin: ''
                httpCallPath: ''
                httpCallMethod: ''
                httpCallStatus: 400
                httpCallCorrelationAttempted: false
                httpCallAsynchronous: false
                initiator: html
