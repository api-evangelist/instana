      - metrics
      - properties
    TagFilterExpressionElement:
      type: object
      description: Boolean expression of tag filters to define the scope of relevant calls.
      discriminator:
        mapping:
          EXPRESSION: '#/components/schemas/TagFilterExpression'
          TAG_FILTER: '#/components/schemas/TagFilter'
        propertyName: type
      properties:
        type:
          type: string
      required:
      - type
    TagFilter:
      type: object
      allOf:
      - $ref: '#/components/schemas/TagFilterExpressionElement'
      - type: object
        properties:
          entity:
            type: string
            description: SOURCE or DESTINATION tag in case of a call tag. For Infrastructure, always set to NOT_APPLICABLE.
            enum:
            - NOT_APPLICABLE
            - DESTINATION
            - SOURCE
          key:
            type: string
            description: Tag key in case of a key/value tag.
            maxLength: 512
            minLength: 0
          name:
            type: string
            description: Name of the tag.
            maxLength: 128
            minLength: 0
          operator:
            type: string
            enum:
            - EQUALS
            - CONTAINS
            - LESS_THAN
            - LESS_OR_EQUAL_THAN
            - GREATER_THAN
            - GREATER_OR_EQUAL_THAN
            - NOT_EMPTY
            - NOT_EQUAL
            - NOT_CONTAIN
            - IS_EMPTY
            - NOT_BLANK
            - IS_BLANK
            - STARTS_WITH
            - ENDS_WITH
            - NOT_STARTS_WITH
            - NOT_ENDS_WITH
            - REGEX_MATCH
          value:
            type: object
            description: Tag value to filter on. Can be a string, number, or boolean value.
      required:
      - entity
      - name
      - operator
    TestResultListItem:
      type: object
      properties:
        metrics:
          type: object
          additionalProperties:
            type: array
            items:
