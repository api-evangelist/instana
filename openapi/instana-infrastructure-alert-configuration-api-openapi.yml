                  regex: false
                threshold:
                  type: staticThreshold
                  operator: '>='
                  value: 1
                  lastUpdated: 1724720573744
                forecastingConfig: null
                alertChannelIds:
                - VjS1NvcXpOARmTvA
                - CrLI3QeIZKygaNLH
                granularity: 60000
                timeThreshold:
                  type: violationsInSequence
                  timeWindow: 180000
                id: 4kxgJAXdSDiu6swQaKXrJw
                created: 1724720587414
                initialCreated: 1714766649532
                readOnly: false
                enabled: false
                customPayloadFields:
                - type: staticString
                  key: testKey
                  value: team-ar
                rules:
                - thresholdOperator: '>='
                  rule:
                    alertType: genericRule
                    metricName: memory.usage
                    entityType: crio
                    aggregation: MEAN
                    crossSeriesAggregation: MEAN
                    regex: false
                  thresholds:
                    WARNING:
                      type: staticThreshold
                      value: 1
                    CRITICAL:
                      type: staticThreshold
                      value: 4
              schema:
                $ref: '#/components/schemas/InfraAlertConfigWithMetadata'
          description: OK
