      operationId: enableInfraAlertConfig
      parameters:
      - description: ID of the Infra Smart Alert configuration to enable
        example: 4kxgJAXdSDiu6swQaKXrJw
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
