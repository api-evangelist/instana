    name: © Instana
    url: http://instana.com
  termsOfService: https://www.instana.com/terms-of-use/
  title: Instana REST API documentation Mobile App Analyze API
  version: 1.307.1417
  x-ibm-ahub-try: true
  x-logo:
    altText: instana logo
    backgroundColor: '#FAFBFC'
    url: header-logo.svg
  description: Searching for answers and best pratices?
servers:
- description: Instana Backend
  url: https://{unit}-{tenant}.instana.io
  variables:
    tenant:
      default: tenant
      description: Customer tenant unit
    unit:
      default: unit
      description: Customer tenant name
- description: Instana Self-Hosted Backend
  url: https://{domain}
  variables:
    domain:
      default: example.com
      description: Customer Self-Hosted domain
tags:
- name: Mobile App Analyze
paths:
  /api/mobile-app-monitoring/analyze/beacon-groups:
    post:
      description: API request to get grouped mobile app beacon metrics.
      operationId: getMobileAppBeaconGroups
      parameters:
      - in: query
        name: fillTimeSeries
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            example:
              metrics:
              - metric: beaconCount
                aggregation: SUM
                granularity: 60
              group:
                groupbyTag: mobileBeacon.view.name
              tagFilterExpression:
                type: EXPRESSION
                logicalOperator: AND
                elements:
                - type: TAG_FILTER
                  name: mobileBeacon.mobileApp.name
                  operator: EQUALS
                  entity: NOT_APPLICABLE
                  value: robot-warehouse
                - type: TAG_FILTER
                  name: mobileBeacon.platform
                  operator: EQUALS
                  entity: NOT_APPLICABLE
                  value: iOS
              timeFrame:
                to: null
                windowSize: 3600000
              type: SESSION_START
            schema:
              $ref: '#/components/schemas/GetMobileAppBeaconGroups'
      responses:
        '200':
          content:
            application/json:
              example:
                items:
                - name: Products
                  earliestTimestamp: 1707023340857
                  cursor:
                    '@class': .IngestionOffsetCursor
                    ingestionTime: 1707026879283
                    offset: 1
                  metrics:
                    beaconCount.sum.60:
                    - - 1707023340000
                      - 47
                    - - 1707023400000
                      - 43
                canLoadMore: false
                totalHits: 1
                totalRepresentedItemCount: 1
                totalRetainedItemCount: 1
                adjustedTimeframe:
                  windowSize: 3540000
                  to: 1707026880000
              schema:
                $ref: '#/components/schemas/MobileAppBeaconGroupsResult'
          description: OK
        '401':
          description: Unauthorized access - requires user authentication.
        '500':
          description: Internal server error.
      security:
      - ApiKeyAuth:
        - Default
      summary: Get grouped beacon metrics
      tags:
      - Mobile App Analyze
      x-ibm-ahub-byok: true
  /api/mobile-app-monitoring/analyze/beacons:
    post:
      description: API request to get all mobile app beacons with matching type.
      operationId: getMobileAppBeacons
      requestBody:
        content:
          application/json:
            example:
              tagFilterExpression:
                entity: NOT_APPLICABLE
                name: mobileBeacon.mobileApp.name
                operator: EQUALS
                value: robot-warehouse
              timeFrame:
                to: null
                windowSize: 60000
              type: SESSION_START
            schema:
              $ref: '#/components/schemas/GetMobileAppBeacons'
      responses:
        '200':
          content:
            application/json:
              example:
                items:
                - beacon:
                    agentVersion: 6.0.22
                    mobileAppId: K3bP-bmCRkyimNai9vvq8o
                    mobileAppLabel: robot-warehouse
                    timestamp: 1707025556799
                    clockSkew: 450
                    ingestionTime: 1707025557248
                    duration: 0
                    batchSize: 1
                    sessionId: B5CB9B35-C822-4101-B192-DC2488924C7F
                    beaconId: c43d78282ee5b5cf
                    parentBeaconId: ''
                    backendTraceId: ''
                    type: sessionStart
                    view: Products
                    customEventName: ''
                    meta:
                      feature.testGroup: beta
                    userIp: 94.134.0.0
                    userId: Example User Id
                    userSessionId: ''
                    userName: Example User Name
                    userEmail: example@example.com
                    userLanguages:
                    - de-DE
                    useFeatures: []
                    bundleIdentifier: com.example.shop
                    appBuild: aba9031kl
                    appVersion: 1.41.4
                    platform: Android
                    osName: Android
                    osVersion: '10'
                    deviceManufacturer: Google
                    deviceModel: Google Pixel 4XL
                    deviceHardware: Google Pixel 4XL
                    viewportWidth: 320
                    viewportHeight: 680
                    carrier: Deutsche Telekom
                    connectionType: wifi
                    effectiveConnectionType: 3g
                    latitude: 50.9865
                    longitude: 6.9304
                    accuracyRadius: 20
                    city: Cologne
                    subdivision: North Rhine-Westphalia
                    subdivisionCode: NW
                    country: Germany
                    countryCode: DE
                    continent: Europe
                    continentCode: EU
                    httpCallUrl: ''
                    httpCallOrigin: ''
                    httpCallPath: ''
                    httpCallMethod: ''
                    httpCallHeaders: {}
                    errorCount: 0
                    errorMessage: ''
                    errorId: ''
                    errorType: ''
                    stackTrace: ''
                    stackTraceLine: []
                    parsedStackTrace: ''
                  cursor:
                    '@class': .IngestionOffsetCursor
                    ingestionTime: 1707025557248
                    offset: 1
                canLoadMore: false
                totalHits: 70
                totalRepresentedItemCount: 70
                totalRetainedItemCount: 70
                adjustedTimeframe:
                  windowSize: 60000
                  to: 1707025560000
              schema:
                $ref: '#/components/schemas/MobileAppBeaconResult'
          description: OK
      security:
      - ApiKeyAuth:
        - Default
      summary: Get all beacons
      tags:
      - Mobile App Analyze
      x-ibm-ahub-byok: true
components:
