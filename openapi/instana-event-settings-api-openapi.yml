          type: string
          maxLength: 64
          minLength: 0
        expirationTime:
          type: integer
          format: int64
        id:
          type: string
          maxLength: 64
          minLength: 0
        lastUpdated:
          type: integer
          format: int64
          minimum: 1
        migrated:
          type: boolean
