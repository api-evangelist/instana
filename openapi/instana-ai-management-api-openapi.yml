openapi: 3.2.0
info:
  contact:
    email: support@instana.com
    name: © Instana
    url: http://instana.com
  termsOfService: https://www.instana.com/terms-of-use/
  title: Instana REST API documentation AI Management API
  version: 1.307.1417
  x-ibm-ahub-try: true
  x-logo:
    altText: instana logo
    backgroundColor: '#FAFBFC'
    url: header-logo.svg
  description: Searching for answers and best pratices?
servers:
- description: Instana Backend
  url: https://{unit}-{tenant}.instana.io
  variables:
    tenant:
      default: tenant
      description: Customer tenant unit
    unit:
      default: unit
      description: Customer tenant name
- description: Instana Self-Hosted Backend
  url: https://{domain}
  variables:
    domain:
      default: example.com
      description: Customer Self-Hosted domain
tags:
- name: AI Management
paths:
  /api/llm/capabilities:
    get:
      description: Retrieve all available LLM capabilities.
      operationId: getLLMCapabilities
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  enum:
                  - INCIDENT_INVESTIGATION
                  - INCIDENT_SUMMARIZATION
                  - AI_ASSISTANT
                  - MANUAL_ACTION_GENERATION
                  - SCRIPT_GENERATION
          description: OK
        '401':
          description: Unauthorized access - requires user authentication.
        '500':
          description: Internal server error.
      security:
      - ApiKeyAuth: []
      summary: Get all LLM capabilities
      tags:
      - AI Management
      x-ibm-ahub-byok: true
  /api/llm/egress/handler:
    get:
      description: Retrieve all LLM gateways. Optionally filter by enabled status or capability.
      operationId: getLLMEgressGateways
      parameters:
      - description: Filter by enabled status (true/false)
        in: query
        name: enabled
        schema:
          type: boolean
      - description: Filter by capability name
        in: query
        name: capability
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
              - id: a14700b0-401b-47eb-a751-deda0035fde3
                name: Example LLM egress Handler
                description: This is a sample custom handler used for testing.
                aiModel: watsonx-gpt-4
                supports:
                  capabilities:
                  - anomaly-detection
                  - remediation
                metadata:
                  source: user
                  version: 1.0.0
                endpointUrl: https://example.com/handler
                endpointApiKey: secret-api-key
                watsonxKey: watsonx-123
                watsonxProject: project-xyz
                watsonxUrl: https://watsonx.example.com
                instanaAgents:
                  agents:
                  - agent-1
                  - agent-2
                createdAt: 2024-05-01 10:00:00+00:00
                modifiedAt: 2024-05-02 15:30:00+00:00
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LLMEgressGateway'
          description: OK
        '401':
          description: Unauthorized access - requires user authentication.
        '403':
          description: Insufficient permissions.
        '404':
          description: Resource not found.
        '500':
          description: Internal server error.
      security:
      - ApiKeyAuth: []
      summary: Get all LLM gateways
      tags:
      - AI Management
      x-ibm-ahub-byok: true
    post:
      operationId: addLLMEgressGateway
      requestBody:
        content:
          application/json:
            example:
              name: Example LLM egress Handler
              description: This is a sample custom handler used for testing.
              aiModel: watsonx-gpt-4
              supports:
                capabilities:
                - anomaly-detection
                - remediation
              metadata:
                source: user
                version: 1.0.0
              endpointUrl: https://example.com/handler
              endpointApiKey: secret-api-key
              watsonxKey: watsonx-123
              watsonxProject: project-xyz
              watsonxUrl: https://watsonx.example.com
              instanaAgents:
                agents:
                - agent-1
                - agent-2
            schema:
              $ref: '#/components/schemas/LLMEgressGateway'
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                id: a14700b0-401b-47eb-a751-deda0035fde3
                name: Example LLM egress Handler
                description: This is a sample custom handler used for testing.
                aiModel: watsonx-gpt-4
                supports:
                  capabilities:
                  - anomaly-detection
                  - remediation
                metadata:
                  source: user
                  version: 1.0.0
                endpointUrl: https://example.com/handler
                endpointApiKey: secret-api-key
                watsonxKey: watsonx-123
                watsonxProject: project-xyz
                watsonxUrl: https://watsonx.example.com
                instanaAgents:
                  agents:
                  - agent-1
                  - agent-2
              schema:
                $ref: '#/components/schemas/LLMEgressGateway'
          description: OK
        '401':
          description: Unauthorized access - requires user authentication.
        '403':
          description: Insufficient permissions.
        '500':
          description: Internal server error.
      security:
      - ApiKeyAuth:
        - canConfigureLLM
      summary: Create a new LLM gateway
      tags:
      - AI Management
      x-ibm-ahub-byok: true
  /api/llm/egress/handler/{id}:
    delete:
      description: Delete a LLM egress gateway by ID.
      operationId: deleteLLMEgressGateway
      parameters:
      - description: LLM gateway ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Successful - no content to return.
        '401':
          description: Unauthorized access - requires user authentication.
        '403':
          description: Insufficient permissions.
        '404':
          description: Resource not found.
        '500':
          description: Internal server error.
      security:
      - ApiKeyAuth:
        - canConfigureLLM
      summary: Delete a LLM egress gateway
      tags:
      - AI Management
      x-ibm-ahub-byok: true
    get:
      description: Retrieve a LLM gateway by ID.
      operationId: getLLMEgressGatewayById
      parameters:
      - description: LLM gateway ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                id: a14700b0-401b-47eb-a751-deda0035fde3
                name: Example LLM egress Handler
                description: This is a sample custom handler used for testing.
                aiModel: watsonx-gpt-4
                supports:
                  capabilities:
                  - anomaly-detection
                  - remediation
                metadata:
                  source: user
                  version: 1.0.0
                endpointUrl: https://example.com/handler
                endpointApiKey: secret-api-key
                watsonxKey: watsonx-123
                watsonxProject: project-xyz
                watsonxUrl: https://watsonx.example.com
                instanaAgents:
                  agents:
                  - agent-1
                  - agent-2
                createdAt: 2024-05-01 10:00:00+00:00
                modifiedAt: 2024-05-02 15:30:00+00:00
              schema:
                $ref: '#/components/schemas/LLMEgressGateway'
          description: OK
        '401':
          description: Unauthorized access - requires user authentication.
        '403':
          description: Insufficient permissions.
        '404':
          description: Resource not found.
        '500':
          description: Internal server error.
      security:
      - ApiKeyAuth:
        - Default
      summary: Get a LLM gateway by ID
      tags:
      - AI Management
      x-ibm-ahub-byok: true
    put:
      description: Update an existing LLM gateway by ID.
      operationId: updateLLMEgressGateway
      parameters:
      - description: LLM gateway ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              name: Example LLM egress Handler
              description: This is a sample custom handler used for testing.
              aiModel: watsonx-gpt-4
              supports:
                capabilities:
                - anomaly-detection
                - remediation
              metadata:
                source: user
                version: 1.0.0
              endpointUrl: https://example.com/handler
              endpointApiKey: secret-api-key
              watsonxKey: watsonx-123
              watsonxProject: project-xyz
              watsonxUrl: https://watsonx.example.com
              instanaAgents:
                agents:
                - agent-1
                - agent-2
            schema:
              $ref: '#/components/schemas/LLMEgressGateway'
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                id: a14700b0-401b-47eb-a751-deda0035fde3
                name: Example LLM egress Handler
                description: This is a sample custom handler used for testing.
                aiModel: watsonx-gpt-4
                supports:
                  capabilities:
                  - anomaly-detection
                  - remediation
                metadata:
                  source: user
                  version: 1.0.0
                endpointUrl: https://example.com/handler
                endpointApiKey: secret-api-key
                watsonxKey: watsonx-123
                watsonxProject: project-xyz
                watsonxUrl: https://watsonx.example.com
                instanaAgents:
                  agents:
                  - agent-1
                  - agent-2
              schema:
                $ref: '#/components/schemas/LLMEgressGateway'
          description: OK
        '401':
          description: Unauthorized access - requires user authentication.
        '403':
          description: Insufficient permissions.
        '404':
          description: Resource not found.
        '500':
          description: Internal server error.
      security:
      - ApiKeyAuth:
        - canConfigureLLM
      summary: Update an existing LLM gateway
      tags:
      - AI Management
      x-ibm-ahub-byok: true
  /api/llm/egress/handler/{id}/enable:
    put:
      description: Enable a LLM gateway by ID. Any other enabled gateway for the same capability will be automatically disabled.
      operationId: enableLLMEgressGateway
      parameters:
      - description: LLM gateway ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Successful - no content to return.
        '401':
          description: Unauthorized access - requires user authentication.
        '403':
          description: Insufficient permissions.
        '404':
          description: Resource not found.
        '500':
          description: Internal server error.
      security:
      - ApiKeyAuth:
        - canConfigureLLM
      summary: Set the enabled status of a LLM gateway
      tags:
      - AI Management
      x-ibm-ahub-byok: true
components:
  schemas:
    JsonNode:
      type: object
    LLMEgressGateway:
      type: object
      description: Custom handler definition.
      properties:
        aiModel:
          type: string
        configurations:
          $ref: '#/components/schemas/JsonNode'
        createdAt:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        endpointApiKey:
          type: string
        endpointUrl:
          type: string
        id:
          type: string
          format: uuid
        instanaAgents:
          $ref: '#/components/schemas/JsonNode'
        metadata:
          $ref: '#/components/schemas/JsonNode'
        modifiedAt:
          type: string
        name:
          type: string
        prompt:
          type: string
        supports:
          $ref: '#/components/schemas/JsonNode'
        system:
          type: boolean
        tenantUnitId:
          type: string
        watsonxKey:
          type: string
        watsonxProject:
          type: string
        watsonxUrl:
          type: string
      required:
      - createdAt
      - id
      - modifiedAt
      - name
      - prompt
      - supports
      - tenantUnitId
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: authorization
      type: apiKey
      description: "## Example\n\n```bash\ncurl --request GET \\\n  --url https://test-instana.instana.io/api/application-monitoring/catalog/metrics \\\n  --header 'authorization: apiToken xxxxxxxxxxxxxxxx'\n```\n"
