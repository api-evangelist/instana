tags:
- name: Application Alert Configuration
  description: The API endpoints of this group can be used to manage Application alert configurations.
paths:
  /api/events/settings/application-alert-configs:
    get:
      description: 'Gets all the Smart Alert Configurations pertaining to a specific application. Configurations are sorted by creation date in descending order.

        For more information on Application Alert Configuration please access the https://developer.ibm.com/apis/catalog/instana--instana-rest-api/Applications#application-alert-configuration.'
      operationId: findAllActiveApplicationAlertConfigs
      parameters:
      - description: The ID of a specific Application.
        example: IYS1XOEcTNiT1eOD8pxgXg
        in: query
        name: applicationId
        required: true
        schema:
          type: string
      - description: A list of Smart Alert Configuration IDs. This allows fetching of a specific set of Configurations. This query can be repeated to use multiple IDs.
        example: IYS1XOEcTNiT1eOD8pxgXg
        in: query
        name: alertIds
        schema:
          type: array
          items:
            type: string
          maxItems: 1000
          minItems: 0
          uniqueItems: true
      responses:
        '200':
          content:
            application/json:
              example:
              - name: Erroneous call rate is higher than normal
                description: The erroneous call rate is higher or equal to 4%.
                boundaryScope: ALL
                applicationId: IYS1XOEcTNiT1eOD8pxgXg
                applications:
                  IYS1XOEcTNiT1eOD8pxgXg:
                    applicationId: IYS1XOEcTNiT1eOD8pxgXg
                    inclusive: true
                    services: {}
                severity: 5
                triggering: false
                tagFilterExpression:
                  type: EXPRESSION
                  logicalOperator: AND
                  elements: []
                includeInternal: false
                includeSynthetic: false
                rule:
                  alertType: errors
                  metricName: errors
                  aggregation: MEAN
                threshold:
                  type: staticThreshold
                  operator: '>='
                  value: 0.04
                  lastUpdated: 0
                alertChannelIds: []
                granularity: 600000
                timeThreshold:
                  type: violationsInSequence
                  timeWindow: 600000
                evaluationType: PER_AP
                customPayloadFields: []
                id: A5VvSXR_SVG6z7YbnIHiHQ
                created: 1707751873882
                initialCreated: 1707751873882
                readOnly: false
                enabled: true
                derivedFromGlobalAlert: false
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationAlertConfigWithMetadata'
          description: OK - Returns an empty list if no configurations match the criteria
        '403':
          description: Insufficient permissions.
      security:
      - ApiKeyAuth:
        - Default
      summary: Get all Smart Alert Configs
      tags:
      - Application Alert Configuration
      x-ibm-ahub-byok: true
    post:
      description: 'Creates a new Smart Alert Configuration.

        For more information on Application Alert Configuration please access the https://developer.ibm.com/apis/catalog/instana--instana-rest-api/Applications#application-alert-configuration.'
      operationId: createApplicationAlertConfig
      requestBody:
        content:
          application/json:
            example:
              name: Calls are slower than usual
              description: Calls are slower or equal to the expectation based on latency (90th).
              boundaryScope: INBOUND
              applicationId: ZOi0te_ERE-mRm-9zsbwdg
              applications:
                ZOi0te_ERE-mRm-9zsbwdg:
                  applicationId: ZOi0te_ERE-mRm-9zsbwdg
                  inclusive: true
                  services: {}
              severity: 5
              triggering: false
              tagFilterExpression:
                type: TAG_FILTER
                name: endpoint.name
                stringValue: null
                numberValue: null
                booleanValue: null
                key: null
                value: null
                operator: NOT_EMPTY
                entity: DESTINATION
              includeInternal: false
              includeSynthetic: false
              rule:
                alertType: slowness
                aggregation: P90
                metricName: latency
              threshold:
                type: historicBaseline
                operator: '>='
                seasonality: DAILY
                baseline:
                - - 0
                  - 1
                  - 3
                - - 600000
                  - 1
                  - 3
                deviationFactor: 3
                lastUpdated: 0
              alertChannelIds: []
              granularity: 600000
              timeThreshold:
                type: violationsInSequence
                timeWindow: 600000
              evaluationType: PER_AP
              customPayloadFields: []
            schema:
              $ref: '#/components/schemas/ApplicationAlertConfig'
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                name: Calls are slower than usual
                description: Calls are slower or equal to the expectation based on latency (90th).
                boundaryScope: INBOUND
                applicationId: ZOi0te_ERE-mRm-9zsbwdg
                applications:
                  ZOi0te_ERE-mRm-9zsbwdg:
                    applicationId: ZOi0te_ERE-mRm-9zsbwdg
                    inclusive: true
                    services: {}
                severity: 5
                triggering: false
                tagFilterExpression:
                  type: TAG_FILTER
                  name: endpoint.name
                  stringValue: null
                  numberValue: null
                  booleanValue: null
                  key: null
                  value: null
                  operator: NOT_EMPTY
                  entity: DESTINATION
                includeInternal: false
                includeSynthetic: false
                rule:
                  alertType: slowness
                  aggregation: P90
                  metricName: latency
                threshold:
                  type: historicBaseline
                  operator: '>='
                  seasonality: DAILY
                  baseline:
                  - - 0
                    - 1
                    - 3
                  - - 600000
                    - 1
                    - 3
                  deviationFactor: 3
                  lastUpdated: 0
                alertChannelIds: []
                granularity: 600000
                timeThreshold:
                  type: violationsInSequence
                  timeWindow: 600000
                evaluationType: PER_AP
                customPayloadFields: []
                id: DKp0JArJRAiQIav9CoKSWQ
                created: 1706617456952
                initialCreated: 1706617456952
                readOnly: false
                enabled: true
                derivedFromGlobalAlert: false
              schema:
                $ref: '#/components/schemas/ApplicationAlertConfigWithMetadata'
          description: Smart Alert Configuration created.
        '400':
          description: Invalid Configuration.
        '403':
          description: Insufficient permissions.
        '422':
          description: Unprocessable entity.
        '428':
          description: Baseline calculation failed due to insufficient data.
      security:
      - ApiKeyAuth:
        - CanConfigureApplicationSmartAlerts
      summary: Create Smart Alert Config
      tags:
      - Application Alert Configuration
      x-ibm-ahub-byok: true
