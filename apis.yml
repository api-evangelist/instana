- aid: instana:instana-synthetic-metrics-api
  name: Instana Synthetic Metrics API
  description: "The endpoints of this group retrieve metrics for Synthetic test results.\n### Mandatory\
    \ Parameters\n\n**metrics** A list of metric objects that define which metric should be returned,\
    \ with the defined aggregation. Each metrics objects consists of minimum two items:\n1. *metric* select\
    \ a particular metric. This is the list of available metrics for all types of Synthetic Tests:\n \
    \  synthetic.metricsResponseTime (ms), synthetic.metricsResponseSize (bytes), synthetic.metricsStatusCode\
    \ (an integer represents an HTTP response code, e.g., 200, 401, 500), synthetic.metricsRequestSize\
    \ (bytes),\n   synthetic.metricsUploadSpeed (bytes per second), synthetic.metricsDownloadSpeed (bytes\
    \ per second),\n   synthetic.metricsRedirectTime (ms), synthetic.metricsRedirectCount, synthetic.metricsConnectCount,\
    \ synthetic.metricsStatus (an integer, 1-success or 0-failure), synthetic.successRate, and synthetic.tags\
    \ (list of custom properties and values).\n\n   The following metrics are only available for the HTTPAction\
    \ type Synthetic Tests: synthetic.metricsBlocking (bytes), synthetic.metricsDns (bytes), synthetic.metricsConnect\
    \ (bytes), synthetic.metricsSsl (bytes),\n   synthetic.metricsSending (bytes), synthetic.metricsWaiting\
    \ (bytes), and synthetic.metricsReceiving (bytes).\n\n   The metric synthetic.customMetrics (list\
    \ of custom metrics and values) is only available for SSLCertificate and DNS tests.  For SSLCertificate,\
    \ the custom metrics are returned as metrics.  For DNS, the custom metrics are returned in the *ismDetails*\
    \ field.\n\n   The metric synthetic.tags adds the latest list of custom properties to the response.\n\
    \n2. *aggregation* Depending on the selected metric, different aggregations are available e.g., SUM,\
    \ MEAN, P90 (90th percentile), DISTINCT_COUNT, and MAX.  MAX is only allowed for synthetic.tags. Metric\
    \ synthetic.successRate only accepts MEAN.\n\n**timeFrame** As in our UI you can specify the timeframe\
    \ for metrics retrieval.\n```\n  windowSize           to\n     (ms)       (unix-timestamp)\n<----------------------|\n\
    ```\nThe timeFrame might be adjusted to fit the metric granularity so that there is no partial bucket.\
    \ For example, if the query timeFrame is 08:02 - 09:02 and the metric granularity is 5 minutes, the\
    \ timeFrame will be adjusted to 08:05 - 09:00. The adjusted timeFrame will be returned in the response\
    \ payload. If the query does not have any metric with granularity, a default granularity will be used\
    \ for adjustment. \n\nIf **groups** includes a groupbyTag that is an array, such as synthetic.tags,\
    \ the maximum windowSize is *3600000* (1 hour).\n\n### Optional Parameters\n\n**metrics** By default\
    \ you will get an aggregated metric for the selected timeframe\n\n* *granularity*\n  * If it is not\
    \ set you will get an aggregated value for the selected timeframe\n  * If the granularity is set you\
    \ will get data points with the specified granularity **in seconds**\n  * The granularity should not\
    \ be greater than the `windowSize` (important: `windowSize` is expressed in **milliseconds**)\n  *\
    \ The granularity should not be set too small relative to the `windowSize` to avoid creating an excessively\
    \ large number of data points (max 600)\n  * The granularity values are the same for all metrics\n\
    \n**pagination** if you use pagination, fix the timeFrame for the retrieved metrics\n1. *page* select\
    \ the page number you want to retrieve\n2. *pageSize* set the number of Synthetic test results you\
    \ want to return with one query\n\n**groups** You can group test results by one or more tags.\n1.\
    \ *groupbyTag* use the metric or tag name, e.g. \"synthetic.applicationId\", to group by its value\n\
    2. *groupbyTagSecondLevelTag* is optional.  It is used to further qualify values when the *groupbyTag*\
    \ is an array of key/value pairs, such as \"synthetic.tags\".\n3. *groupbyTagEntity* is ignored and\
    \ therefore does not need to be specified.\n\nIf *groups* is not specified, the default grouping is\
    \ *synthetic.testId*.\n\nAn example of grouping by the custom property \"region\":\n```\n  \"groups\"\
    : [\n    {\n      \"groupbyTag\": \"synthetic.tags\",\n      \"groupbyTagSecondLevelTag\": \"region\"\
    \n    }\n  ]\n```\n\n**includeAggregatedTestIds** Optionally used when not grouping by testId.  Specifying\
    \ *true* will return a list of tests that were included in the aggregated result for each row returned.\n\
    \n**tagFilterExpression** It serves as a filter to narrow down return results. Its type can be either\
    \ EXPRESSION or TAG_FILTER with\nlogical operators \"AND\" or \"OR\".\n\nA tagFilterExpression can\
    \ specify a custom property by its key and value.\n```\n  \"tagFilterExpression\": {\n    \"type\"\
    : \"EXPRESSION\",\n    \"logicalOperator\": \"AND\",\n    \"elements\": [\n      {\n        \"name\"\
    : \"synthetic.tags\",\n        \"key\": \"region\",\n        \"value\": \"Denver\",\n        \"operator\"\
    : \"EQUALS\"\n      },\n      {\n        \"name\": \"synthetic.locationId\",\n        \"operator\"\
    : \"EQUALS\",\n        \"stringValue\": \"abcdefgXSJmQsehOWg1S\"\n      }\n    ]\n  }\n```\n\n###\
    \ Defaults\n\n**groups**\n```\n  \"groups\": [\n    \"groupbyTag\": \"synthetic.testId\"\n  ]\n```\n\
    \n**includeAggregatedTestIds**\n* *includeAggregatedTestIds:* *true* when grouping by synthetic.testId,\
    \ otherwise *false*.\n\n**metrics**\n* *granularity:* 0\n\n**pagination**\n* If **pagination** is\
    \ not specified, the entire result set is returned.\n\n**timeFrame**\n```\n  \"timeFrame\": {\n  \
    \  \"to\": {current timestamp},\n    \"windowSize\": 60000\n  }\n```\n\n### Sample payload to get\
    \ the mean synthetic.metricsResponseTIme for each Synthetic test within the specified timeFrame\n\
    ```json\n{\n    \"metrics\": [\n     {\n        \"aggregation\": \"MEAN\",\n        \"metric\": \"\
    synthetic.metricsResponseTime\"\n     }],\n     \"timeFrame\": {\n       \"to\": 0,\n       \"windowSize\"\
    : 1800000  \n     }\n} \n```\n\n### Sample payload to get the mean synthetic.metricsResponseTIme for\
    \ each Synthetic test within the specified timeFrame grouped by applicationId\n```json\n{\n    \"\
    metrics\": [\n     {\n        \"aggregation\": \"MEAN\",\n        \"metric\": \"synthetic.metricsResponseTime\"\
    \n     }],\n     \"timeFrame\": {\n       \"to\": 0,\n       \"windowSize\": 1800000  \n     },\n\
    \     \"groups\": [{\n       \"groupbyTag\": \"synthetic.applicationId\"\n     }]\n} \n```\n\n###\
    \ Sample payload to get the synthetic.successRate for the Synthetic tests within the specified timeFrame\
    \ grouped by the two custom properties region and cluster.\n```json\n{\n    \"metrics\": [\n    {\n\
    \        \"aggregation\": \"MEAN\",\n        \"metric\": \"synthetic.successRate\"\n    }],\n    \"\
    timeFrame\": {\n        \"to\": 0,\n        \"windowSize\": 1800000\n    },\n    \"groups\": [\n \
    \   {\n        \"groupbyTag\": \"synthetic.tags\",\n        \"groupbyTagSecondLevelKey\": \"region\"\
    \n    },\n    {\n        \"groupbyTag\": \"synthetic.tags\",\n        \"groupbyTagSecondLevelKey\"\
    : \"cluster\"\n    }]\n}\n```"
  humanURL: https://www.ibm.com/docs/en/instana-observability/current?topic=apis-rest-api
  tags:
  - Synthetic Metrics
