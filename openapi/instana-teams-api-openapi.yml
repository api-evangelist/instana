openapi: 3.2.0
info:
  contact:
    email: support@instana.com
    name: © Instana
    url: http://instana.com
  termsOfService: https://www.instana.com/terms-of-use/
  title: Instana REST API documentation Teams API
  version: 1.307.1417
  x-ibm-ahub-try: true
  x-logo:
    altText: instana logo
    backgroundColor: '#FAFBFC'
    url: header-logo.svg
  description: Searching for answers and best pratices?
servers:
- description: Instana Backend
  url: https://{unit}-{tenant}.instana.io
  variables:
    tenant:
      default: tenant
      description: Customer tenant unit
    unit:
      default: unit
      description: Customer tenant name
- description: Instana Self-Hosted Backend
  url: https://{domain}
  variables:
    domain:
      default: example.com
      description: Customer Self-Hosted domain
tags:
- name: Teams
paths:
  /api/settings/rbac/teams:
    get:
      description: Retrieve all user teams for the current tenant unit.
      operationId: getTeams
      responses:
        '200':
          content:
            application/json:
              example:
              - id: teamId1
                tag: team1
                info:
                  description: Team 1 description
                scope:
                  accessPermissions:
                  - CAN_CONFIGURE_APPLICATIONS
                  - CAN_CONFIGURE_EVENTS
                  restrictedApplicationFilter: null
                  applications:
                  - app-123
                  - app-456
                  websites: []
                  mobileApps: []
                  kubernetesClusters:
                  - cluster-1
                  kubernetesNamespaces: []
                  syntheticTests: []
                  syntheticCredentials: []
                  businessPerspectives: []
                  tagIds:
                  - tag-1
                  actionFilter: ''
                  logFilter: ''
                  infraDfqFilter: ''
                members:
                - userId: userId1
                  email: username1@example.com
                  name: User One
                  roles:
                  - roleId: role-1
                    roleName: Admin
                    viaIdP: false
                - userId: userId2
                  email: username2@example.com
                  name: User Two
                  roles:
                  - roleId: role-2
                    roleName: Developer
                    viaIdP: false
              - id: teamId2
                tag: team2
                info:
                  description: Team 2 description
                scope:
                  accessPermissions:
                  - CAN_CONFIGURE_INFRASTRUCTURE
                  restrictedApplicationFilter: null
                  applications: []
                  websites: []
                  mobileApps: []
                  kubernetesClusters: []
                  kubernetesNamespaces:
                  - namespace-1
                  syntheticTests: []
                  syntheticCredentials: []
                  businessPerspectives: []
                  tagIds: []
                  actionFilter: ''
                  logFilter: ''
                  infraDfqFilter: ''
                members:
                - userId: userId1
                  email: username1@example.com
                  name: User One
                  roles:
                  - roleId: role-1
                    roleName: Admin
                    viaIdP: false
                - userId: userId3
                  email: username3@example.com
                  name: User Three
                  roles:
                  - roleId: role-3
                    roleName: Operator
                    viaIdP: true
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiTeam'
          description: OK
        '404':
          description: No teams found
      security:
      - ApiKeyAuth:
        - CanConfigureTeams
      summary: Get all teams
      tags:
      - Teams
      x-ibm-ahub-byok: true
    post:
      description: Create a new team.
      operationId: createTeam
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTeam'
        description: Team to create
        required: true
      responses:
        '200':
          description: Team created successfully
      security:
      - ApiKeyAuth:
        - CanConfigureTeams
      summary: Create team
      tags:
      - Teams
      x-ibm-ahub-byok: true
  /api/settings/rbac/teams/{id}:
    delete:
      description: Delete the team data.
      operationId: deleteTeam
      parameters:
      - description: Id of the team to delete
        example: teamId
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        default:
          content:
            application/json: {}
          description: default response
      security:
      - ApiKeyAuth:
        - CanConfigureTeams
      summary: Delete team
      tags:
      - Teams
      x-ibm-ahub-byok: true
    get:
      description: Retrieve a specific team by its ID.
      operationId: getTeam
      parameters:
      - description: Id of the team for retrieval
        example: teamId
        in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: includeTeamUsage
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              example:
                id: team-1
                tag: Development Team
                info:
                  description: Team responsible for application development
                scope:
                  accessPermissions:
                  - CAN_CONFIGURE_APPLICATIONS
                  - CAN_CONFIGURE_EVENTS
                  restrictedApplicationFilter:
                    restrictingApplicationId: app-123
                  applications:
                  - app-123
                  - app-456
                  websites:
                  - website-1
                  mobileApps:
                  - mobile-1
                  kubernetesClusters:
                  - cluster-1
                  kubernetesNamespaces:
                  - namespace-1
                  syntheticTests:
                  - test-1
                  syntheticCredentials: []
                  businessPerspectives:
                  - bp-1
                  tagIds:
                  - tag-1
                  - tag-2
                  actionFilter: ''
                  logFilter: ''
                  infraDfqFilter: ''
                members:
                - userId: user-1
                  email: user1@example.com
                  name: John Doe
                  roles:
                  - roleId: role-1
                    roleName: Admin
                    viaIdP: false
                - userId: user-2
                  email: user2@example.com
                  name: Jane Smith
                  roles:
                  - roleId: role-2
                    roleName: Developer
                    viaIdP: false
              schema:
                $ref: '#/components/schemas/ApiTeam'
          description: Successfully retrieved the team
        '404':
          description: Team not found
      security:
      - ApiKeyAuth:
        - CanConfigureTeams
      summary: Get team by ID
      tags:
      - Teams
      x-ibm-ahub-byok: true
    put:
      description: Update an existing team by ID.
      operationId: updateTeam
      parameters:
      - description: Id of the team to update
        example: teamId
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTeam'
      responses:
        '200':
          description: Team updated successfully
        '404':
          description: Team not found
      security:
      - ApiKeyAuth:
        - CanConfigureTeams
      summary: Update team
      tags:
      - Teams
      x-ibm-ahub-byok: true
components:
  schemas:
    ApiTeamRole:
      type: object
      properties:
        roleId:
          type: string
        roleName:
          type: string
        viaIdP:
          type: boolean
      required:
      - roleId
    ApiTeamInfo:
      type: object
      properties:
        description:
          type: string
          maxLength: 2048
          minLength: 0
    ApiTeamMember:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/ApiTeamRole'
          uniqueItems: true
        userId:
          type: string
      required:
      - userId
    TagFilterExpressionElement:
      type: object
      description: Boolean expression of tag filters to define the scope of relevant calls.
      discriminator:
        mapping:
          EXPRESSION: '#/components/schemas/TagFilterExpression'
          TAG_FILTER: '#/components/schemas/TagFilter'
        propertyName: type
      properties:
        type:
          type: string
      required:
      - type
    ApiRestrictedApplicationFilter:
      type: object
      properties:
        label:
          type: string
        restrictingApplicationId:
          type: string
        scope:
          type: string
          enum:
          - INCLUDE_NO_DOWNSTREAM
          - INCLUDE_IMMEDIATE_DOWNSTREAM_DATABASE_AND_MESSAGING
          - INCLUDE_ALL_DOWNSTREAM
        tagFilterExpression:
          $ref: '#/components/schemas/TagFilterExpressionElement'
    ApiTeamScope:
      type: object
      properties:
        accessPermissions:
          type: array
          items:
            type: string
            enum:
            - LIMITED_APPLICATIONS_SCOPE
            - LIMITED_WEBSITES_SCOPE
            - LIMITED_KUBERNETES_SCOPE
            - LIMITED_MOBILE_APPS_SCOPE
            - LIMITED_INFRASTRUCTURE_SCOPE
            - LIMITED_SYNTHETICS_SCOPE
            - LIMITED_BIZOPS_SCOPE
            - LIMITED_GEN_AI_SCOPE
            - LIMITED_AUTOMATION_SCOPE
            - LIMITED_LOGS_SCOPE
            - LIMITED_ALERT_CHANNELS_SCOPE
            - LIMITED_VSPHERE_SCOPE
            - LIMITED_PHMC_SCOPE
            - LIMITED_POWERVC_SCOPE
            - LIMITED_ZHMC_SCOPE
            - LIMITED_PCF_SCOPE
            - LIMITED_OPENSTACK_SCOPE
            - LIMITED_SAP_SCOPE
            - LIMITED_NUTANIX_SCOPE
            - LIMITED_XENSERVER_SCOPE
            - LIMITED_WINDOWS_HYPERVISOR_SCOPE
            - LIMITED_LINUX_KVM_HYPERVISOR_SCOPE
            - LIMITED_AI_GATEWAY_SCOPE
            - LIMITED_SERVICE_LEVEL_SCOPE
          uniqueItems: true
        actionFilter:
          type: string
        applications:
          type: array
          items:
            type: string
          uniqueItems: true
        businessPerspectives:
          type: array
          items:
            type: string
          uniqueItems: true
        infraDfqFilter:
          type: string
        kubernetesClusters:
          type: array
          items:
            type: string
          uniqueItems: true
        kubernetesNamespaces:
          type: array
          items:
            type: string
          uniqueItems: true
        logFilter:
          type: string
        mobileApps:
          type: array
          items:
            type: string
          uniqueItems: true
        restrictedApplicationFilter:
          $ref: '#/components/schemas/ApiRestrictedApplicationFilter'
        sloIds:
          type: array
          items:
            type: string
          uniqueItems: true
        syntheticCredentials:
          type: array
          items:
            type: string
          uniqueItems: true
        syntheticTests:
          type: array
          items:
            type: string
          uniqueItems: true
        tagIds:
          type: array
          items:
            type: string
          uniqueItems: true
        websites:
          type: array
          items:
            type: string
          uniqueItems: true
    ApiTeam:
      type: object
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 0
        info:
          $ref: '#/components/schemas/ApiTeamInfo'
        members:
          type: array
          items:
            $ref: '#/components/schemas/ApiTeamMember'
          uniqueItems: true
        scope:
          $ref: '#/components/schemas/ApiTeamScope'
        tag:
          type: string
          maxLength: 256
          minLength: 0
      required:
      - tag
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: authorization
      type: apiKey
      description: "## Example\n\n```bash\ncurl --request GET \\\n  --url https://test-instana.instana.io/api/application-monitoring/catalog/metrics \\\n  --header 'authorization: apiToken xxxxxxxxxxxxxxxx'\n```\n"
