- aid: instana:instana-synthetic-calls-api
  name: Instana Synthetic Calls API
  description: "The API endpoints of this group can fetch, update and delete the synthetic endpoint configuration\
    \ rules.\n\n**Note:** There are some following restrictions to use `matchSpecification` parameter\
    \ for Synthetic endpoint configuration: \n\n1. `matchSpecification.type` should be `LEAF`.\n2. `matchSpecification.key`\
    \ should be always be `endpoint.name`.\n3. `matchSpecification.operator` should be among the following\
    \ options: `EQUALS`, `CONTAINS`, `STARTS_WITH`, `ENDS_WITH`, `NOT_STARTS_WITH`, `NOT_ENDS_WITH`.\n\
    4. `matchSpecification.entity` should be `DESTINATION` as health check endpoint is considered as a\
    \ destination endpoint."
