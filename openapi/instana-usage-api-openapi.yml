openapi: 3.2.0
info:
  contact:
    email: support@instana.com
    name: © Instana
    url: http://instana.com
  termsOfService: https://www.instana.com/terms-of-use/
  title: Instana REST API documentation Usage API
  version: 1.307.1417
  x-ibm-ahub-try: true
  x-logo:
    altText: instana logo
    backgroundColor: '#FAFBFC'
    url: header-logo.svg
  description: Searching for answers and best pratices?
servers:
- description: Instana Backend
  url: https://{unit}-{tenant}.instana.io
  variables:
    tenant:
      default: tenant
      description: Customer tenant unit
    unit:
      default: unit
      description: Customer tenant name
- description: Instana Self-Hosted Backend
  url: https://{domain}
  variables:
    domain:
      default: example.com
      description: Customer Self-Hosted domain
tags:
- name: Usage
paths:
  /api/instana/usage/api:
    get:
      operationId: getAllUsage
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsageResult'
          description: OK
      security:
      - ApiKeyAuth:
        - CanViewAccountAndBillingInformation
      summary: API usage by customer
      tags:
      - Usage
      x-ibm-ahub-byok: true
  /api/instana/usage/api/{day}/{month}/{year}:
    get:
      operationId: getUsagePerDay
      parameters:
      - in: path
        name: day
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: month
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: year
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsageResult'
          description: OK
      security:
      - ApiKeyAuth:
        - CanViewAccountAndBillingInformation
      summary: API usage day / month / year
      tags:
      - Usage
      x-ibm-ahub-byok: true
  /api/instana/usage/api/{month}/{year}:
    get:
      operationId: getUsagePerMonth
      parameters:
      - in: path
        name: month
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: year
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsageResult'
          description: OK
      security:
      - ApiKeyAuth:
        - CanViewAccountAndBillingInformation
      summary: API usage month / year
      tags:
      - Usage
      x-ibm-ahub-byok: true
  /api/instana/usage/hosts/{day}/{month}/{year}:
    get:
      operationId: getHostsPerDay
      parameters:
      - in: path
        name: day
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: month
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: year
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsageResult'
          description: OK
      security:
      - ApiKeyAuth:
        - CanViewAccountAndBillingInformation
      summary: Host count day / month / year
      tags:
      - Usage
      x-ibm-ahub-byok: true
  /api/instana/usage/hosts/{month}/{year}:
    get:
      operationId: getHostsPerMonth
      parameters:
      - in: path
        name: month
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: year
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsageResult'
          description: OK
      security:
      - ApiKeyAuth:
        - CanViewAccountAndBillingInformation
      summary: Host count month / year
      tags:
      - Usage
      x-ibm-ahub-byok: true
components:
  schemas:
    UsageResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UsageResultItems'
        time:
          type: integer
          format: int64
    UsageResultItems:
      type: object
      properties:
        name:
          type: string
        sims:
          type: integer
          format: int64
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: authorization
      type: apiKey
      description: "## Example\n\n```bash\ncurl --request GET \\\n  --url https://test-instana.instana.io/api/application-monitoring/catalog/metrics \\\n  --header 'authorization: apiToken xxxxxxxxxxxxxxxx'\n```\n"
