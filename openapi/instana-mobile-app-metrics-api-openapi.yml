openapi: 3.2.0
info:
  contact:
    email: support@instana.com
    name: © Instana
    url: http://instana.com
  termsOfService: https://www.instana.com/terms-of-use/
  title: Instana REST API documentation Mobile App Metrics API
  version: 1.307.1417
  x-ibm-ahub-try: true
  x-logo:
    altText: instana logo
    backgroundColor: '#FAFBFC'
    url: header-logo.svg
  description: Searching for answers and best pratices?
servers:
- description: Instana Backend
  url: https://{unit}-{tenant}.instana.io
  variables:
    tenant:
      default: tenant
      description: Customer tenant unit
    unit:
      default: unit
      description: Customer tenant name
- description: Instana Self-Hosted Backend
  url: https://{domain}
  variables:
    domain:
      default: example.com
      description: Customer Self-Hosted domain
tags:
- name: Mobile App Metrics
paths:
  /api/mobile-app-monitoring/metrics:
    post:
      deprecated: true
      description: API request to get mobile app monitoring beacon metrics.
      operationId: getMobileAppBeaconMetrics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetMobileAppMetrics'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAppMetricResult'
          description: OK
      security:
      - ApiKeyAuth:
        - Default
      summary: Get mobile app beacon metrics
      tags:
      - Mobile App Metrics
      x-ibm-ahub-byok: true
  /api/mobile-app-monitoring/session{id}{timestamp}:
    get:
      description: API request to get a mobile app monitoring session.
      operationId: getSession
      parameters:
      - description: Identifier of the session to be retrieved
        example: 9CA9E31D-B0F7-40EC-8D32-FE163A6557AE
        in: path
        name: id
        required: true
        schema:
          type: string
        style: matrix
      - description: Timestamp of the session to be retrieved
        example: 1730595029980
        in: path
        name: timestamp
        required: true
        schema:
          type: integer
          format: int64
        style: matrix
      responses:
        '200':
          content:
            application/json:
              example:
              - agentVersion: 1.8.5
                mobileAppId: K3bP-bmCRkyimNai9vvq8o
                mobileAppLabel: robot-warehouse
                timestamp: 1707025019211
                clockSkew: 460
                ingestionTime: 1707025019670
                duration: 0
                batchSize: 1
                sessionId: 9CA9E31D-B0F7-40EC-8D32-FE163A6557AE
                beaconId: 659302486df75422
                parentBeaconId: ''
                backendTraceId: ''
                type: sessionStart
                view: Products
                customEventName: ''
                meta:
                  feature.testGroup: sigma
                userIp: 149.200.0.0
                userId: Example user id
                userSessionId: ''
                userName: Example user name
                userEmail: example@example.com
                userLanguages:
                - ar-JO
                useFeatures: []
                bundleIdentifier: com.example.shop
                appBuild: aba9031kl
                appVersion: 1.42.3
                platform: iOS
                osName: iOS
                osVersion: 16.7.1
                deviceManufacturer: Apple
                deviceModel: iPhone 13
                deviceHardware: iPhone14,5
                viewportWidth: 320
                viewportHeight: 680
                carrier: Orange
                connectionType: wifi
                effectiveConnectionType: 3g
                latitude: 31.9555
                longitude: 35.9435
                accuracyRadius: 20
                city: Amman
                subdivision: Amman Governorate
                subdivisionCode: AM
                country: Jordan
                countryCode: JO
                continent: Asia
                continentCode: AS
                httpCallUrl: ''
                httpCallOrigin: ''
                httpCallPath: ''
                httpCallMethod: ''
                httpCallHeaders: {}
                errorCount: 0
                errorMessage: ''
                errorId: ''
                errorType: ''
                stackTrace: ''
                stackTraceLine: []
                parsedStackTrace: ''
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MobileAppMonitoringBeacon'
          description: OK
        '400':
          description: Bad request.
        '401':
          description: Unauthorized access - requires user authentication.
        '404':
          description: Resource not found.
        '500':
          description: Internal server error.
      security:
      - ApiKeyAuth:
        - Default
      summary: Get mobile app session
      tags:
      - Mobile App Metrics
      x-ibm-ahub-byok: true
  /api/mobile-app-monitoring/v2/metrics:
    post:
      description: API request to get mobile app monitoring beacon metrics.
      operationId: getMobileAppBeaconMetricsV2
      requestBody:
        content:
          application/json:
            example:
              metrics:
              - metric: beaconCount
                aggregation: SUM
                granularity: 60
              tagFilterExpression:
                type: EXPRESSION
                logicalOperator: AND
                elements:
                - type: TAG_FILTER
                  name: mobileBeacon.mobileApp.name
                  operator: EQUALS
                  entity: NOT_APPLICABLE
                  value: robot-warehouse
                - type: TAG_FILTER
                  name: mobileBeacon.view.name
                  operator: EQUALS
                  entity: NOT_APPLICABLE
                  value: Products
              timeFrame:
                to: null
                windowSize: 3600000
              type: SESSION_START
            schema:
              $ref: '#/components/schemas/GetMobileAppMetricsV2'
      responses:
        '200':
          content:
            application/json:
              example:
                metrics:
                  beaconCount.sum.60:
                  - - 1707026940000
                    - 75
                  - - 1707027000000
                    - 75
                adjustedTimeframe:
                  windowSize: 3540000
                  to: 1707030480000
              schema:
                $ref: '#/components/schemas/MetricAPIResult'
          description: OK
        '401':
          description: Unauthorized access - requires user authentication.
        '500':
          description: Internal server error.
      security:
      - ApiKeyAuth:
        - Default
      summary: Get beacon metrics
      tags:
      - Mobile App Metrics
      x-ibm-ahub-byok: true
