          items:
            type: string
        runType:
          type: string
        testId:
          type: string
        testLabel:
          type: string
        testResultId:
          type: string
        testType:
          type: string
        websites:
          type: array
          items:
            type: string
      required:
      - completed
      - customization
      - locationId
      - locationLabel
      - testId
      - testLabel
      - testResultId
      - testType
    SyntheticGeoPoint:
      type: object
      properties:
        cityName:
          type: string
        countryName:
          type: string
