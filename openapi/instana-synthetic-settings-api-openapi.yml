        countryName:
          type: string
        datacenterId:
          type: string
        expectedActiveAt:
          type: integer
          format: int64
        label:
          type: string
          maxLength: 128
          minLength: 1
        latitude:
          type: number
          format: double
        locationLabel:
          type: string
        longitude:
          type: number
          format: double
        modifiedAt:
          type: integer
          format: int64
        provider:
          type: string
          maxLength: 128
          minLength: 1
        status:
