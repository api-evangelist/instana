        example: mappingId
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        default:
          content:
            application/json: {}
          description: default response
      security:
      - ApiKeyAuth:
        - CanConfigureAuthenticationMethods
      summary: Delete group mapping
      tags:
      - Groups
      x-ibm-ahub-byok: true
    get:
      operationId: getGroupMapping
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                id: mappingId
                key: roles
                value: analyst
                groupId: '-3'
              schema:
                $ref: '#/components/schemas/GroupMapping'
          description: OK
        '404':
