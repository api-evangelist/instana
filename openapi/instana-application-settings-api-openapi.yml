                endpointCase: LOWER
                endpointNameByFirstPathSegmentRuleEnabled: false
                endpointNameByCollectedPathTemplateRuleEnabled: false
                rules: null
              - serviceId: d0cedae516f2182ede16f57f67476dd4c7dab9cd
